<style>
*{box-sizing:border-box;margin:0;padding:0;}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root{
  /* Sessa brand palette — from propuesta comercial */
  --bg:#F0F2F5;
  --surface:#FFFFFF;
  --surface2:#F7F8FA;
  --border:#DDE2EA;
  --border2:#E8ECF2;
  --text:#1A2332;
  --text2:#4A5568;
  --text3:#8896A6;
  --accent:#3D5FA0;       /* Sessa blue */
  --accent-dark:#2C4A85;
  --accent-bg:#EBF0FA;
  --accent-light:#F0F4FC;
  --green:#0F6E56;
  --green-bg:#E1F5EE;
  --amber:#854F0B;
  --amber-bg:#FAEEDA;
  --red:#A32D2D;
  --red-bg:#FCEBEB;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(61,95,160,.08),0 2px 8px rgba(61,95,160,.04);
  --shadow-lg:0 4px 20px rgba(61,95,160,.12);
  --sidebar-bg:#1E2D4A;   /* dark navy like the PDF right panel */
  --sidebar-text:#E8EDF5;
  --sidebar-text2:#8FA3C4;
  --sidebar-active:#3D5FA0;
  --sidebar-active-bg:#2C3E5C;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:960px;margin:0 auto;padding:24px 20px 80px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 18px;border-bottom:1.5px solid var(--border);margin-bottom:24px;}
.logo-img{height:40px;width:auto;transition:opacity .2s;}
.header-stats{display:flex;gap:20px;}
.hstat{text-align:right;}
.hstat-num{font-size:26px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em;}
.hstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:500;}
.tabs{display:flex;gap:0;border-bottom:1.5px solid var(--border);margin-bottom:20px;}
.tab{font-size:13px;font-weight:500;padding:10px 20px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;font-family:inherit;transition:color .15s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;} /* legacy */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.toolbar input{flex:1;min-width:150px;height:36px;padding:0 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;}
.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.08);}
.toolbar select{height:36px;padding:0 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;font-family:inherit;}
.btn{height:36px;padding:0 16px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s;}
.btn:hover{background:#F0EDE8;border-color:#C8C4BC;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;letter-spacing:.01em;}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn-danger{background:#FCEBEB;border-color:#A32D2D;color:#791F1F;font-size:11px;}
.btn-danger:hover{background:#F7C1C1;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:#666;}
.leg-dot{width:7px;height:7px;border-radius:50%;}
.sec-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.10em;margin:16px 0 10px;}
.sec-label.cierre-lbl{color:#085041;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:8px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);}
.pcard:hover{border-color:#C0BAB0;box-shadow:0 4px 16px rgba(0,0,0,.09);transform:translateY(-1px);}
.pcard.active{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(61,95,160,.10);}
.pcard.alerta{border:2px solid #E24B4A;background:#FFF8F8;}
.pcard.exclusiva{border-top:3px solid #EF9F27;}
.pcard.reserva-comp{border:2px solid #A32D2D;background:#FFF5F5;}
.pcard.finalizada{border:1px solid #1D9E75;opacity:.7;background:linear-gradient(135deg,#f0fdf8,#fff);}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.pcard-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#999;}
.inac-days{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;}
.inac-ok{background:#E1F5EE;color:#085041;}
.inac-warn{background:#FAEEDA;color:#633806;}
.inac-red{background:#FCEBEB;color:#A32D2D;}
.fin-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#E1F5EE;color:#085041;font-weight:600;}
.pcard-addr{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:2px;line-height:1.35;}
.pcard-owner{font-size:11px;color:#666;margin-bottom:2px;}
.pcard-price{font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:4px;}
.pcard-ingreso{font-size:10px;color:#999;margin-bottom:5px;}
.prog-lbl{display:flex;justify-content:space-between;font-size:10px;color:#999;margin-bottom:2px;}
.pcard-bar{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-bottom:4px;}
.pcard-fill{height:100%;border-radius:2px;}
.inac-bar{height:3px;background:#eee;border-radius:2px;overflow:hidden;margin-bottom:2px;}
.inac-fill{height:100%;border-radius:2px;}
.asesor-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.01em;}
.modal-overlay{background:rgba(0,0,0,.4);border-radius:12px;padding:20px;margin-bottom:16px;display:flex;align-items:flex-start;justify-content:center;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:580px;box-shadow:var(--shadow-lg);}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:22px;letter-spacing:-.02em;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-grid.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.form-group input,.form-group select,.form-group textarea{height:36px;padding:0 10px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:100%;font-family:inherit;}
.form-group textarea{height:64px;padding:8px 10px;resize:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#185FA5;}
.form-section{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid #eee;}
.check-group{display:flex;gap:16px;flex-wrap:wrap;}
.check-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#1a1a1a;cursor:pointer;}
.check-item input[type=checkbox]{width:14px;height:14px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid #eee;padding-top:16px;}
.err{font-size:11px;color:#A32D2D;margin-top:2px;}
.detail{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:10px;box-shadow:var(--shadow);}
.detail.alerta-det{border:2px solid #E24B4A;}
.detail.finalizada-det{border:2px solid #1D9E75;background:linear-gradient(180deg,#f0fdf8 0%,#fff 80px);}
.fin-banner{background:linear-gradient(135deg,#E1F5EE 0%,#d4f0e4 50%,#E1F5EE 100%);color:#085041;padding:20px 16px 16px;border-radius:14px;margin-bottom:16px;text-align:center;border:2px solid #1D9E75;position:relative;overflow:hidden;}
.fin-banner-emoji{font-size:40px;display:block;margin-bottom:6px;animation:pop 0.5s ease;}
.fin-banner-title{font-size:16px;font-weight:800;color:#085041;margin-bottom:4px;}
.fin-banner-date{font-size:12px;color:#2a7a5a;font-weight:500;}
.fin-banner-confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
@keyframes pop{0%{transform:scale(0.5);opacity:0;}60%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(80px) rotate(360deg);opacity:0;}}
.det-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.det-addr{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.det-meta{font-size:12px;color:#666;margin-top:3px;}
.det-right{text-align:right;}
.det-pct{font-size:34px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-.03em;}
.det-pct-lbl{font-size:11px;color:#999;margin-top:2px;}
.inac-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12px;font-weight:600;}
.inac-banner.ok{background:#E1F5EE;color:#085041;}
.inac-banner.warn{background:#FAEEDA;color:#633806;}
.inac-banner.red{background:#FCEBEB;color:#A32D2D;}
.inac-banner-bar{flex:1;height:6px;border-radius:3px;overflow:hidden;background:rgba(0,0,0,.1);}
.inac-banner-fill{height:100%;border-radius:3px;}
.prog-bar{height:5px;background:var(--border2);border-radius:3px;margin-bottom:18px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.info-pill{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:var(--surface2);font-weight:500;}
.ingreso-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;}
.ingreso-wrap input{font-size:11px;padding:3px 8px;height:28px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:130px;font-family:inherit;}
.etapa-block{margin-bottom:14px;}
.etapa-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:20px;display:inline-block;margin-bottom:10px;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid var(--border2);border-radius:10px;margin-bottom:5px;background:var(--surface);transition:all .12s;}
.task-row.clickable{cursor:pointer;}
.task-row.clickable:hover{border-color:#CCC8C0;background:var(--surface2);}
.task-row.done{opacity:.4;}
.task-row.done .ttext{text-decoration:line-through;}
.task-row.sub{margin-left:24px;}
.cb{width:16px;height:16px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s;}
.ttext{font-size:13px;color:#1a1a1a;line-height:1.4;}
.field-inp{font-size:13px;padding:4px 10px;height:30px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;margin-left:8px;font-family:inherit;}
.field-inp:focus{border-color:#185FA5;}
.no-sel{text-align:center;padding:60px 40px;font-size:13px;color:var(--text3);}
.resumen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
.resumen-modal{background:#fff;border-radius:14px;padding:24px;width:90%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.resumen-modal h3{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
.resumen-modal p{font-size:12px;color:#888;margin-bottom:12px;}
.resumen-textarea{width:100%;font-size:14px;padding:10px 12px;border:1px solid #ddd;border-radius:10px;resize:none;font-family:inherit;color:#1a1a1a;outline:none;line-height:1.5;}
.resumen-textarea:focus{border-color:#185FA5;}
/* Login */
.login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1E2D4A 0%,#3D5FA0 100%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 8px 48px rgba(0,0,0,.10);text-align:center;}
.login-logo{height:64px;margin-bottom:28px;}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.01em;}
.login-sub{font-size:13px;color:#888;margin-bottom:24px;}
.login-input{width:100%;height:40px;padding:0 12px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;margin-bottom:12px;}
.login-input:focus{border-color:#185FA5;}
.login-btn{width:100%;height:44px;font-size:14px;font-weight:700;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;margin-top:8px;transition:background .15s;}
.login-btn:hover{background:#0C447C;}
.login-err{font-size:12px;color:#A32D2D;margin-top:8px;min-height:18px;}
.user-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:#666;}
.user-pill span{font-weight:600;color:#1a1a1a;}
.logout-btn{font-size:11px;padding:3px 10px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#666;cursor:pointer;font-family:inherit;}
.logout-btn:hover{background:#f0ede8;}
/* Saving indicator */
.tokko-modal{background:#fff;border-radius:14px;padding:24px;width:90%;max-width:620px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.tokko-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eee;border-radius:10px;margin-bottom:6px;background:#fff;}
.tokko-row:hover{border-color:#bbb;}
.tokko-check{width:16px;height:16px;cursor:pointer;accent-color:#185FA5;}
.tokko-addr{flex:1;font-size:13px;font-weight:600;color:#1a1a1a;}
.tokko-meta{font-size:11px;color:#888;}
.tokko-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#E6F1FB;color:#0C447C;font-weight:600;}
.field-missing{border:1.5px solid #EF9F27 !important;background:#FFFBF0 !important;}
.field-missing-label{color:#854F0B !important;}
.missing-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#854F0B;background:#FAEEDA;border:1px solid #854F0B;border-radius:10px;padding:2px 8px;margin-bottom:10px;}
/* ── App Shell Layout ─────────────────────────────────────────── */
.app-shell{display:flex;min-height:100vh;background:var(--bg);}

.sidebar{
  width:200px;flex-shrink:0;
  background:var(--sidebar-bg);
  border-right:none;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;height:100vh;
  z-index:100;
  box-shadow:2px 0 12px rgba(0,0,0,.15);
}

.sidebar-logo{
  padding:20px 16px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo .logo-img{height:40px;width:auto;}

.sidebar-nav{
  flex:1;padding:12px 10px;
  display:flex;flex-direction:column;gap:2px;
  overflow-y:auto;
}

.nav-item{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:9px 12px;
  border:none;background:transparent;
  border-radius:var(--radius-sm);
  cursor:pointer;font-family:inherit;
  font-size:12.5px;color:var(--sidebar-text2);
  text-align:left;transition:all .15s;
  letter-spacing:.01em;
}
.nav-item:hover{background:var(--sidebar-active-bg);color:var(--sidebar-text);}
.nav-item.active{
  background:var(--sidebar-active) !important;
  color:#fff !important;
  font-weight:600;
}
.nav-item:not(.active){
  background:transparent !important;
  border-bottom-color:transparent !important;
}
.nav-item:focus{outline:none;}
.nav-item svg{flex-shrink:0;color:inherit;}

.nav-badge{
  margin-left:auto;font-size:10px;font-weight:700;
  background:rgba(255,255,255,.2);color:#fff;
  padding:1px 7px;border-radius:20px;
  display:none;
}
.nav-badge.visible{display:inline-block;}

.nav-divider{height:1px;background:rgba(255,255,255,.08);margin:8px 4px;}

.sidebar-footer{
  border-top:1px solid rgba(255,255,255,.08);
  padding:12px 10px;
}
.sidebar-user{
  display:flex;align-items:center;gap:8px;
}
.sidebar-avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--sidebar-active);color:#fff;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sidebar-user-info{
  display:flex;flex-direction:column;min-width:0;flex:1;
}
.sidebar-user-name{
  font-size:12px;font-weight:600;color:var(--sidebar-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sidebar-user-role{font-size:10px;color:var(--sidebar-text2);}

.main-content{
  margin-left:200px;flex:1;min-width:0;
}

body.dark .sidebar{background:#111827;border-color:#1f2937;}
body.dark .nav-item:hover{background:#1f2937;}
body.dark .nav-item.active{background:var(--sidebar-active);color:#fff;}

/* ── Override .app padding for new layout ────────────────────── */
.app{max-width:none;padding:24px 28px 80px;}


.save-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75;
/* Dark mode */
body.dark{background:#1a1a1a;color:#e0e0e0;}
body.dark .app{background:#1a1a1a;}
body.dark .header{background:#111;border-color:#333;}
body.dark .pcard{background:#242424;border-color:#333;color:#e0e0e0;}
body.dark .pcard:hover{background:#2a2a2a;}
body.dark .detail{background:#242424;border-color:#333;color:#e0e0e0;}
body.dark .tab{color:#aaa;}
body.dark .tab.active{color:#e0e0e0;border-color:#e0e0e0;}
body.dark .task-row{background:#2a2a2a;border-color:#333;}
body.dark .task-row:hover{background:#333;}
body.dark input,body.dark textarea,body.dark select{background:#333;color:#e0e0e0;border-color:#444;}
body.dark .info-pill{background:#333;border-color:#444;color:#ccc;}
body.dark .modal{background:#242424;color:#e0e0e0;}
body.dark .modal-overlay{background:rgba(0,0,0,.7);}
body.dark .login-box{background:#242424;border-color:#333;}
body.dark .login-input{background:#333;color:#e0e0e0;border-color:#444;}
body.dark #dark-toggle{background:#333;border-color:#444;color:#fff;}display:inline-block;margin-left:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.resumen-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
.asesor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.asesor-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border:1px solid #e8e5e0;border-radius:12px;}

<!-- Login Screen -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <img id="login-logo" class="login-logo" alt="Sessa Propiedades"/>
    <div class="login-title">Sessa Propiedades</div>
    <div class="login-sub">Ingresá con tu cuenta</div>
    <input id="login-email" class="login-input" type="email" placeholder="Email" autocomplete="username"/>
    <input id="login-pass"  class="login-input" type="password" placeholder="Contraseña" autocomplete="current-password"/>
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- Main App (hidden until logged in) -->
<div class="app" id="main-app" style="display:none;">
  <div class="app-shell">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

      <div id="header-stats" style="display:flex;gap:0;flex-direction:column;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);"></div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="setTab('props',this)" data-tab="props">

          <span>Propiedades</span>

        </button>
        <button class="nav-item" onclick="setTab('compradores',this)" data-tab="compradores">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Compradores</span>

        <option>Casa</option><option>Dpto</option><option>PH</option><option>Monoambiente</option><option>Lote</option><option>Galpon</option><option>Local</option>
      </select>
      <select id="filt-tag" onchange="renderGrid()" style="height:36px;padding:0 10px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;font-family:inherit;">

        <option value="oportunidad">🟢 Oportunidad</option>

      <select id="filt-asesor" onchange="renderGrid()" style="height:36px;padding:0 10px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;font-family:inherit;">
        <option value="">Todos los asesores</option>
      </select>

      <div class="leg"><div class="leg-dot" style="background:#EF9F27;"></div>Seguimiento</div>
      <div class="leg"><div class="leg-dot" style="background:#1D9E75;"></div>Cierre</div>
      <div class="leg"><div class="leg-dot" style="background:#E24B4A;"></div>Inactiva +14d</div>
    </div>
    <div id="modal-area"></div>
    <div id="main-list"></div>
    <div id="prop-detail"></div>
  </div>

function dSince(ts){ return Math.floor((Date.now()-ts)/86400000); }

// Auto-complete year if user types dd/mm or d/m format
function fixDateYear(val){
  if(!val) return val;
  val = val.trim();
  // Already has year (dd/mm/yyyy or dd/mm/yy)
  if(val.split('/').length === 3) return val;
  // Only dd/mm → append current year
  if(val.match(/^\d{1,2}\/\d{1,2}$/)){
    return val + '/' + new Date().getFullYear();
  }
  return val;
}
function parseDate(str){
  if(!str||!str.trim()) return null;
  var parts = str.trim().split('/');
  if(parts.length===3) return new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
  return null;
}
function diasSinContacto(p){
  var d = parseDate(p.lastContacto);
  if(!d) return null;
  return Math.max(0, Math.floor((Date.now()-d.getTime())/86400000));
}
function iCls(d){ return d===null?'ok':d>=MAX?'red':d>=7?'warn':'ok'; }
function iCol(d){ return (d===null||d<7)?'#1D9E75':d>=MAX?'#E24B4A':'#EF9F27'; }
function iPct(d){ return d===null?0:Math.min(100,Math.round(d/MAX*100)); }
function saveVencAuth(pid, val){

function setVencAuthDefault(pid, days){
  var p = props.find(function(x){return x.id===pid;}); if(!p) return;
  days = days || 90;
  var d = new Date();
  d.setDate(d.getDate() + days);
  var fecha = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  p.fechaVencAuth = fecha;
  var inp = document.getElementById('venc-auth-'+pid);
  if(inp) inp.value = fecha;
  renderDetail();
  renderGrid();
}

function diasParaVencAuth(p){
  if(!p.fechaVencAuth) return null;
  var parts = p.fechaVencAuth.split('/');
  if(parts.length<3) return null;
  var d = new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
  return Math.ceil((d.getTime()-Date.now())/86400000);
}

  var btn = event.target;

  var TOKKO_KEY = 'a816281c7b5e042cf4b63ce93dae3b4ff5817c7e';

    var resp = await fetch('https://www.tokkobroker.com/api/v1/property/?key='+TOKKO_KEY+'&format=json&limit=200&lang=es_ar&current_status=2');
    var data = await resp.json();
    var tokkoItems = data.objects || [];
    var cambios = [];
    props.forEach(function(p){
      if(!p.tokkoId) return;
      var tk = tokkoItems.find(function(t){ return String(t.id)===String(p.tokkoId); });

    var rows = '';

          '<div style="flex:1;">'+
            '<div style="font-size:13px;font-weight:600;color:#A32D2D;">'+p.addr+'</div>'+

          '<button data-pid="'+p.id+'" onclick="ignorarBaja(parseInt(this.dataset.pid),this)" '+
          'style="height:26px;padding:0 10px;font-size:11px;font-weight:600;border:1px solid #ddd;border-radius:6px;background:#fff;color:#888;cursor:pointer;font-family:inherit;">Ignorar</button>'+
        '</div>';
      }).join('');
      if(cambios.length) rows += '<div style="height:1px;background:#eee;margin:12px 0;"></div>';
    }

    // Cambios de precio
    if(cambios.length){
      rows += '<div style="font-size:12px;font-weight:700;color:#854F0B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">💰 Cambios de precio ('+cambios.length+')</div>';
      rows += cambios.map(function(c){
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#FAEEDA;border-radius:8px;margin-bottom:6px;">'+
          '<div style="flex:1;font-size:13px;font-weight:600;">'+c.prop.addr+'</div>'+
          '<div style="font-size:12px;color:#888;text-decoration:line-through;">'+c.anterior+'</div>'+

        '</div>';
      }).join('');
    }

      '<div class="resumen-modal" style="max-width:520px;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'+
          '<h3 style="font-size:15px;font-weight:700;">🔄 Sincronización con Tokko</h3>'+
          '<button onclick="closeExportModal(this)" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;">×</button>'+

function injectInactivityTasks(){
  // For each prop inactive 10+ days that belongs to current user, add reminder task if not already there
  var me = getMyAsesor();
  var myProps = props.filter(function(p){
    if(p.finalizada) return false;
    var d = diasSinContacto(p); if(d===null || d<10) return false;
    // Is this prop mine?
    var tkName = (p.tokkoProducerName||'').trim().toLowerCase();
    var meName = me ? me.name.trim().toLowerCase() : '';
    return isAdmin() || (meName && tkName===meName) || (me && p.asesorId===me.id);
  });

  if(!myProps.length) return;

  var key = me ? me.name : 'admin';
  if(!tareasPerAsesor[key]) tareasPerAsesor[key] = { lastReset: toDay(), tasks: getDefaultTasks() };
  var state = tareasPerAsesor[key];

  var changed = false;
  myProps.forEach(function(p){
    var taskId = 'inac-'+p.id;
    var exists = state.tasks.find(function(t){ return t.id===taskId; });
    if(!exists){
      var d = diasSinContacto(p);
      state.tasks.push({
        id: taskId,
        text: 'Contactar propietario de '+p.addr+' ('+d+' días sin contacto)',
        cat: 'Clientes',
        done: false,
        auto: true
      });
      changed = true;
    }
  });

  // Remove auto tasks for props that are no longer inactive
  state.tasks = state.tasks.filter(function(t){
    if(!t.auto) return true;
    var pid = t.id.replace('inac-','');
    var p = props.find(function(x){ return String(x.id)===pid; });
    if(!p) return false; // prop deleted
    var d = diasSinContacto(p);
    return d!==null && d>=10 && !p.finalizada;
  });

  if(changed) saveMiDia();
  var tabEl = document.getElementById('tab-tareas');
  if(tabEl && tabEl.style.display !== 'none') renderTareas();
}

function generarDescripcionPlantilla(pid){
  var p = props.find(function(x){return x.id===pid;}); if(!p) return;
  var obs = p.observaciones || '';
  var dormsM = obs.match(/([0-9]+)\s*dorm/i);
  var banosM = obs.match(/([0-9]+)\s*ba/i);
  var ambM   = obs.match(/([0-9]+)\s*amb/i);
  var barrioM = obs.match(/barrio[: ]+([^.]+)/i);
  var expM = obs.match(/expensas[: $]*([0-9.,]+)/i);
  var aptoBanco = p.aptoBanco ? 'Apto banco.' : '';
  var excl = '';
  var autoTask = p.tasks&&p.tasks.pre ? p.tasks.pre.find(function(x){return x.id==='pre_2';}) : null;
  if(autoTask&&autoTask.autoVal==='exclusiva') excl = 'Propiedad en exclusiva.';
  var lines = [];
  lines.push((p.tipo||'Propiedad') + ' en venta' + (barrioM?' en '+barrioM[1].trim():'') + '.');
  lines.push('');
  if(dormsM) lines.push('Dormitorios: ' + dormsM[1]);
  if(ambM&&!dormsM) lines.push('Ambientes: ' + ambM[1]);
  if(banosM) lines.push('Banos: ' + banosM[1]);
  if(p.precio) lines.push('Precio: ' + p.precio);
  if(expM) lines.push('Expensas: $' + expM[1]);
  lines.push('');
  if(aptoBanco) lines.push(aptoBanco);
  if(excl) lines.push(excl);
  if(obs) lines.push('Zona: ' + obs.split('.')[0].trim());
  lines.push('');
  lines.push('Mas informacion: Sessa Propiedades');
  var desc = lines.join('\n');
  var ta = document.getElementById('mkt-desc-'+pid);
  if(ta){ ta.value = desc; guardarDescripcion(pid, desc); }
  else {
    var t = p.tasks&&p.tasks.mkt ? p.tasks.mkt.find(function(x){return x.id==='mkt_descripcion';}) : null;
    if(t){ t.texto = desc; saveProp(p); renderDetail(); }
  }
  showSaveToast('Descripcion generada');
}

function doFusionar(pid1){ var sel=document.getElementById('fusionar-sel'); if(sel) fusionarProps(pid1,parseInt(sel.value)); }

function fusionarProps(pid1, pid2){
  if(!pid2){ alert('Seleccioná una propiedad'); return; }
  var p1 = props.find(function(x){return x.id===pid1;});
  var p2 = props.find(function(x){return x.id===pid2;});
  if(!p1||!p2) return;
  if(!confirm('¿Fusionar "'+p2.addr+'" dentro de "'+p1.addr+'"? Esta acción no se puede deshacer.')) return;
  // Merge visitas
  if(!p1.visitas) p1.visitas = [];
  if(p2.visitas&&p2.visitas.length) p1.visitas = p1.visitas.concat(p2.visitas);
  // Merge comentarios
  if(!p1.comentarios) p1.comentarios = [];
  if(p2.comentarios&&p2.comentarios.length) p1.comentarios = p1.comentarios.concat(p2.comentarios);
  // Merge activityLog
  if(!p1.activityLog) p1.activityLog = [];
  p1.activityLog.push({texto:'Fusionada con: '+p2.addr,quien:'Sistema',fecha:new Date().toLocaleDateString('es-AR'),ts:Date.now()});
  // Merge tags
  if(p2.tags) p2.tags.forEach(function(t){ if(!p1.tags) p1.tags=[]; if(!p1.tags.includes(t)) p1.tags.push(t); });
  // Delete p2
  props = props.filter(function(x){return x.id!==pid2;});
  window._fb.deleteDoc(window._fb.doc(window._fb.db,'sessa_props',String(pid2))).catch(function(e){console.error(e);});
  saveProp(p1);
  document.querySelector('.resumen-overlay').remove();
  activeProp = pid1;
  renderGrid(); renderDetail();
  showSaveToast('✅ Propiedades fusionadas');
}

function copiarLinkColega(pid, tokkoId){

  var link = 'https://www.tokkobroker.com/shared_property/?key=a816281c7b5e042cf4b63ce93dae3b4ff5817c7e&property_id='+tokkoId;
  navigator.clipboard.writeText(link).then(function(){

    '<div class="pcard-ingreso" style="display:flex;justify-content:space-between;">'+
      '<span>Ingreso: '+(p.ingreso||'—')+'</span>'+

function openResumen(pid){
  var p = props.find(function(x){return x.id===pid;}); if(!p) return;
  // Build default resumen
  var s = stg(p);
  var emoji = {pre:'🔑',mkt:'📣',seg:'🔄',cierre:'🤝'}[s.id] || '🏠';
  var defaultText =
    emoji+' *'+p.addr+'*\n'+
    '📍 '+p.tipo+(p.aptoBanco?' | Apto banco':'')+' | '+p.publicacion+'\n'+
    '💰 '+p.precio+'\n'+
    (p.propietario&&p.propietario!=='—'?'👤 '+p.propietario+'\n':'')+
    (p.observaciones?'📝 '+p.observaciones:'');

  // Remove existing overlay if any
  var existing = document.getElementById('resumen-overlay');
  if(existing) existing.remove();

  // Use saved resumen if exists
  var initialText = (p.resumenGuardado && p.resumenGuardado.trim()) ? p.resumenGuardado : defaultText;

  var overlay = document.createElement('div');
  overlay.id = 'resumen-overlay';
  overlay.className = 'resumen-overlay';
  overlay.dataset.pid = pid;
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };

  overlay.innerHTML =
    '<div class="resumen-modal">'+
      '<h3>📋 Resumen para WhatsApp</h3>'+
      '<p style="font-size:12px;color:var(--text3);margin-bottom:8px;">Editá, guardá y copialo cuando quieras.</p>'+
      '<textarea id="resumen-txt" class="resumen-textarea" rows="8" style="min-height:180px;">'+initialText+'</textarea>'+
      '<div style="font-size:11px;color:#bbb;margin-top:4px;text-align:right;" id="resumen-count"></div>'+
      '<div class="resumen-actions">'+
        '<button onclick="closeResumen()" '+
        'style="height:34px;padding:0 14px;font-size:12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-family:inherit;">Cerrar</button>'+
        '<button onclick="guardarResumen()" '+
        'style="height:34px;padding:0 14px;font-size:12px;font-weight:700;border:none;border-radius:8px;background:#185FA5;color:#fff;cursor:pointer;font-family:inherit;">💾 Guardar</button>'+
        '<button onclick="copyResumen()" '+
        'style="height:34px;padding:0 16px;font-size:12px;font-weight:700;border:1px solid #185FA5;border-radius:8px;background:#E6F1FB;color:#0C447C;cursor:pointer;font-family:inherit;">📋 Copiar</button>'+
      '</div>'+
    '</div>';

  document.body.appendChild(overlay);

  // Character counter
  var txt = document.getElementById('resumen-txt');
  var counter = document.getElementById('resumen-count');
  function updateCount(){ counter.textContent = txt.value.length+' caracteres'; }
  txt.addEventListener('input', updateCount);
  updateCount();
  txt.focus();
}

function guardarResumen(){
  var overlay = document.getElementById('resumen-overlay');
  var txt = document.getElementById('resumen-txt');
  if(!overlay||!txt) return;
  var pid = parseInt(overlay.dataset.pid);
  var p = props.find(function(x){return x.id===pid;}); if(!p) return;
  p.resumenGuardado = txt.value;
  saveProp(p);
  showSaveToast('✅ Resumen guardado');
  // Flash button
  var btn = overlay.querySelector('button[onclick="guardarResumen()"]');
  if(btn){ btn.textContent='✅ Guardado'; setTimeout(function(){ btn.textContent='💾 Guardar'; },2000); }
}

function checkBackupReminder(){
  try {
    var last = localStorage.getItem('sessa-last-backup');
    var now = Date.now();
    var TEN_DAYS = 10 * 24 * 60 * 60 * 1000;
    if(!last || (now - parseInt(last)) > TEN_DAYS){
      showBackupReminder();
    }
  } catch(e){}
}

function showBackupReminder(){
  var existing = document.getElementById('backup-reminder');
  if(existing) return;
  var days = '';
  try {
    var last = localStorage.getItem('sessa-last-backup');
    if(last){
      var d = Math.floor((Date.now() - parseInt(last)) / 86400000);
      days = 'Hace ' + d + ' día' + (d!==1?'s':'') + ' sin backup.';
    } else {
      days = 'Nunca realizaste un backup.';
    }
  } catch(e){}

  var bar = document.createElement('div');
  bar.id = 'backup-reminder';
  bar.style.cssText = 'position:fixed;bottom:0;left:200px;right:0;z-index:999;background:#1E2D4A;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,.2);';
  bar.innerHTML =
    '<span style="font-size:16px;">💾</span>'+
    '<div style="flex:1;">'+
      '<span style="font-size:13px;font-weight:600;">Recordatorio de backup</span>'+
      '<span style="font-size:12px;color:#8FA3C4;margin-left:8px;">'+days+' Exportá un backup para proteger tus datos.</span>'+
    '</div>'+
    '<button onclick="exportarBackupExcel();marcarBackupHecho()" '+
    'style="height:32px;padding:0 16px;font-size:12px;font-weight:700;border:none;border-radius:6px;background:#3D5FA0;color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;">💾 Descargar backup</button>'+
    '<button onclick="marcarBackupHecho()" '+
    'style="height:32px;padding:0 14px;font-size:12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;color:#8FA3C4;cursor:pointer;font-family:inherit;white-space:nowrap;">Recordar en 10 días</button>'+

function shareWhatsApp(){
  var txt = document.getElementById('resumen-txt');
  if(!txt) return;
  // Copy to clipboard then open WhatsApp
  navigator.clipboard.writeText(txt.value).then(function(){
    var btn = document.querySelector('#resumen-overlay .resumen-actions button:nth-child(2)');
    if(btn){ btn.textContent='✅ Copiado!'; btn.style.background='#128C7E';
      setTimeout(function(){ btn.textContent='📲 WhatsApp'; btn.style.background='#25D366'; }, 2000); }
    // Open WhatsApp so user can paste
    window.open('https://wa.me/', '_blank');
  }).catch(function(){
    // Fallback: just open WhatsApp with encoded text
    var encoded = encodeURIComponent(txt.value);
    window.open('https://wa.me/?text='+encoded, '_blank');
  });
}

function copyResumen(){
  var txt = document.getElementById('resumen-txt');
  if(!txt) return;
  navigator.clipboard.writeText(txt.value).then(function(){
    var btn = document.querySelector('.resumen-actions button:last-child');
    if(btn){ btn.textContent='✅ Copiado!'; btn.style.background='#E1F5EE'; btn.style.borderColor='#0F6E56'; btn.style.color='#085041'; }
    setTimeout(function(){
      if(btn){ btn.textContent='📋 Copiar'; btn.style.background='#E6F1FB'; btn.style.borderColor='#185FA5'; btn.style.color='#0C447C'; }
    }, 2000);
  }).catch(function(){
    // Fallback
    txt.select();
    document.execCommand('copy');
    var btn = document.querySelector('.resumen-actions button:last-child');
    if(btn){ btn.textContent='✅ Copiado!'; }
  });
}

  const act = list.filter(function(p){return !p.finalizada && !isCierre(p);});
  const fin = list.filter(function(p){return p.finalizada;});
  let h = '';
  if(reserva.length) h += '<div class="sec-label" style="color:#A32D2D;">Reserva tomada — máxima prioridad ('+reserva.length+')</div><div class="grid">'+reserva.map(cardHTML).join('')+'</div>';

function setTab(tab, btn){
  // Update nav active state
  document.querySelectorAll('.nav-item, .tab').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');

  // Hide ALL tabs first
  ['props','compradores','tareas','asesores','stats','captaciones','visitasdb','busquedas','ia','tasador'].forEach(function(t){
    var el = document.getElementById('tab-'+t);
    if(el) el.style.display = 'none';
  });

  // Show selected tab
  var target = document.getElementById('tab-'+tab);
  if(target) target.style.display = '';

  // Render content
  if(tab==='asesores'    && typeof renderAsesores==='function')    renderAsesores();
  if(tab==='compradores' && typeof renderCompradores==='function'){ renderCompradores(); renderCompradorDetail(); }
  if(tab==='tareas'      && typeof renderTareas==='function')      renderTareas();
  if(tab==='stats'       && typeof renderStats==='function')       renderStats();
  if(tab==='captaciones' && typeof renderCaptaciones==='function') renderCaptaciones();
  if(tab==='visitasdb'   && typeof renderVisitasDB==='function')   renderVisitasDB();
  if(tab==='busquedas'   && typeof renderBusquedas==='function')   renderBusquedas();
  if(tab==='ia'          && typeof renderIA==='function')          renderIA();
}

    tasks:[
      {id:'cd_1', t:'', special:'comp_valor'},

      {id:'cd_3', t:'Pedir a la inmo libre deuda de servicios: Agua', sub:true},

      {id:'cd_5', t:'Pedir a la inmo informe de dominio', sub:true},

      {id:'cd_boleto', t:'', special:'comp_boleto'},

    tasks:[
      {id:'cc_1', t:'', special:'comp_escribano'},
      {id:'cc_2', t:'Acompañar proceso de escritura'},
      {id:'cc_3', t:'Verificar entrega de llaves y estado final'},
      {id:'cc_4', t:'Entregar regalo al comprador y solicitar testimonio o reseña'},
      {id:'cc_terminada', t:'', special:'comp_terminada'},
    ]},
];

let compradores = [];
let nextCid = 1;
let activeComprador = null;

function mkCompTasks(e){
  return e.tasks.map(function(tk){
    return {id:tk.id, text:tk.t, done:false, sub:tk.sub||false, special:tk.special||null, valor:'', dias:'', escNombre:'', escTel:''};
  });
}

function mkComprador(id, d){
  var tasks = {};
  ETAPAS_COMP.forEach(function(e){ tasks[e.id] = mkCompTasks(e); });
  return {
    id:id,
    nombre:    d.nombre    || '—',
    telefono:  d.telefono  || '',
    asesorId:  d.asesorId  || 'a1',
    // Propiedad reservada
    propAddr:  d.propAddr  || '—',
    propTipo:  d.propTipo  || '',
    propPrecio:d.propPrecio|| '',
    inmo:      d.inmo      || '',   // inmobiliaria que participa
    // Fechas
    fechaReserva:  d.fechaReserva  || '',
    lastContacto:  d.lastContacto  || '',
    observaciones: d.observaciones || '',
    tasks: tasks,
    finalizada: false,
    fechaFin:   '',
    lastOpen:   Date.now(),
    docs: {boleto:false, escritura:false, planoObra:false, planoPH:false, reglamento:false}
  };
}

function calcPctComp(c){
  var t=0, d=0;
  ETAPAS_COMP.forEach(function(e){ c.tasks[e.id].forEach(function(tk){ t++; if(tk.done) d++; }); });
  return t ? Math.round(d/t*100) : 0;
}

function stgComp(c){
  for(var i=ETAPAS_COMP.length-1;i>=0;i--)
    if(c.tasks[ETAPAS_COMP[i].id].some(function(t){return t.done;})) return ETAPAS_COMP[i];
  return ETAPAS_COMP[0];
}

function diasSinContactoComp(c){
  return diasSinContacto(c); // reuses same parseDate logic
}

function toggleComp(cid, eid, tid){
  var c = compradores.find(function(x){return x.id===cid;}); if(!c) return;
  var t = c.tasks[eid].find(function(x){return x.id===tid;});
  if(!t || t.special==='comp_valor' || t.special==='comp_boleto' || t.special==='comp_escribano' || t.special==='comp_drive') return;
  t.done = !t.done;
  if(t.special==='comp_terminada' && t.done)  { c.finalizada=true;  c.fechaFin=toDay(); }
  if(t.special==='comp_terminada' && !t.done) { c.finalizada=false; c.fechaFin=''; }
  renderCompradores();
  renderCompradorDetail();
}

function openComprador(cid){
  var c = compradores.find(function(x){return x.id===cid;}); if(!c) return;
  activeComprador = activeComprador===cid ? null : cid;
  if(activeComprador===cid) c.lastOpen = Date.now();
  renderCompradores();
  renderCompradorDetail();
}

// ── Render compradores grid ───────────────────────────────────────────────────
function renderCompradores(){
  var el = document.getElementById('comprador-list-el'); if(!el) return;
  var compSearch = document.getElementById('comp-search-inp') ? document.getElementById('comp-search-inp').value.toLowerCase() : '';
  if(!compradores.length){
    el.innerHTML = '<div class="no-sel">No hay compradores cargados. Agregá uno con el botón de arriba.</div>';
    renderCompradorDetail();
    return;
  }
  var myAsesorId = currentAsesorId();
  var allComp = isAdmin() ? compradores : compradores.filter(function(c){
    return !myAsesorId || c.asesorId === myAsesorId;
  });
  var activos   = allComp.filter(function(c){return !c.finalizada;});
  var finalizados = allComp.filter(function(c){return c.finalizada;});
  var html = '';

  if(activos.length){
    html += '<div class="grid">'+activos.map(compCardHTML).join('')+'</div>';
  }
  if(finalizados.length){
    html += '<div class="sec-label">Operaciones finalizadas ('+finalizados.length+')</div>';
    html += '<div class="grid">'+finalizados.map(compCardHTML).join('')+'</div>';
  }
  el.innerHTML = html;
  renderCompradorDetail();
}

function compCardHTML(c){
  var pc = calcPctComp(c);
  var s  = stgComp(c);
  var d  = diasSinContactoComp(c);
  var ic = iCls(d), icol = iCol(d), ip = iPct(d);
  var al = !c.finalizada && d!==null && d>=MAX;
  var a  = getA(c.asesorId);
  var topBadge = c.finalizada
    ? '<span class="fin-badge">🥂 Finalizada</span>'
    : (d===null ? '<span class="inac-days" style="background:#f0ede8;color:#999;">sin contacto</span>'
                : '<span class="inac-days inac-'+ic+'">'+(d===0?'hoy':d+'d')+'</span>');
  return '<div class="pcard'+(activeComprador===c.id?' active':'')+(al?' alerta':'')+(c.finalizada?' finalizada':'')+'" onclick="openComprador('+c.id+')">'+
    '<div class="pcard-top">'+
      '<span class="pcard-type">'+(c.propTipo||'Propiedad')+' · <span class="asesor-badge" style="background:'+a.color+'22;color:'+a.color+';">'+a.name+'</span></span>'+
      topBadge+
    '</div>'+
    '<div class="pcard-addr" style="font-size:13px;">'+c.nombre+'</div>'+
    '<div class="pcard-owner" style="font-size:11px;color:#185FA5;">'+c.propAddr+'</div>'+
    (c.inmo ? '<div class="pcard-owner">Inmo: '+c.inmo+'</div>' : '')+
    '<div class="pcard-price">'+(c.propPrecio||'—')+'</div>'+
    '<div class="pcard-ingreso">Reserva: '+(c.fechaReserva||'—')+'</div>'+
    '<div class="prog-lbl"><span>avance</span><span>'+pc+'%</span></div>'+
    '<div class="pcard-bar"><div class="pcard-fill" style="width:'+pc+'%;background:'+(c.finalizada?'#1D9E75':s.fill)+';"></div></div>'+
    (!c.finalizada
      ? (d===null
          ? '<div class="prog-lbl" style="color:#bbb;"><span>inactividad</span><span>sin fecha</span></div><div class="inac-bar"></div>'

    '</div>'+
    '<div class="det-right" style="margin-left:16px;flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">'+
      '<div class="det-pct">'+pc+'%</div>'+
      '<div class="det-pct-lbl">completado</div>'+
      '<button data-cid="'+c.id+'" onclick="event.stopPropagation();guardadoManualComp(parseInt(this.dataset.cid))" '+
      'style="margin-top:6px;height:32px;padding:0 14px;font-size:12px;font-weight:700;border:none;border-radius:8px;background:#185FA5;color:#fff;cursor:pointer;font-family:inherit;width:100%;">💾 Guardar</button>'+
    '</div>'+
  '</div>'
  '</div>';

  // Inac banner
  if(!c.finalizada){
    var msg = d===null ? 'Ingresá la fecha del último contacto'
            : d>=MAX  ? 'Sin contacto hace más de '+d+' días'
            : d>=7    ? 'Atención: '+d+' días sin contacto'
            : d===0   ? 'Contacto registrado hoy'
            :           'Último contacto hace '+d+' día'+(d===1?'':'s');
    h += '<div class="inac-banner '+(d===null?'ok':ic)+'">'+
         '<div style="flex-shrink:0;">'+msg+'</div>'+
         '<div class="inac-banner-bar"><div class="inac-banner-fill" style="width:'+ip+'%;background:'+icol+';"></div></div>'+
         '<div style="flex-shrink:0;font-size:11px;">'+(d===null?'':d+'/'+MAX+'d')+'</div></div>';
  }

  // Progress bar
  h += '<div class="prog-bar"><div class="prog-fill" style="width:'+pc+'%;background:'+(c.finalizada?'#1D9E75':s.fill)+';"></div></div>';

  // Info pills
  h += '<div class="info-row">'+
    (c.propPrecio?'<span class="info-pill">Precio: '+c.propPrecio+'</span>':'')+
    (c.inmo?'<span class="info-pill" style="background:#E6F1FB;color:#0C447C;border-color:#185FA5;">'+c.inmo+'</span>':'')+
    '</div>';

  if(c.observaciones) h += '<div style="font-size:12px;color:#555;background:#fafaf8;padding:10px 14px;border-radius:10px;margin-bottom:14px;border-left:3px solid '+s.fill+';">'+c.observaciones+'</div>';

  // Etapas checklist
  ETAPAS_COMP.forEach(function(e){
    var list = c.tasks[e.id];
    var dc = list.filter(function(t){return t.done;}).length;
    h += '<div class="etapa-block"><span class="etapa-title" style="background:'+e.bg+';color:'+e.text+';border:1px solid '+e.border+';">'+e.label+' · '+dc+'/'+list.length+'</span>';

    list.forEach(function(t){

      if(t.special === 'comp_valor'){
        h += '<div class="task-row sub">'+
          '<div class="cb" id="cb-comp-valor-'+c.id+'" style="'+(t.valor?'background:#378ADD;border-color:#378ADD;':'')+'">'+
            (t.valor?svgCheck():'')+
          '</div>'+
          '<span class="ttext">Acordar valor de escrituración:</span>'+
          '<input class="field-inp" type="text" placeholder="ej: USD 85.000" value="'+t.valor+'" style="width:130px;" '+
          'oninput="saveCompValor('+c.id+',this.value)" onclick="event.stopPropagation()"/>'+
        '</div>';

      } else if(t.special === 'comp_boleto'){
        var bDone = t.dias && t.dias.trim().length > 0;
        // Countdown
        var countdown = '';
        var countdownColor = '#085041';
        if(t.dias && t.dias!=='NO' && t.boletoFecha){
          var daysNum = parseInt(t.dias);
          if(!isNaN(daysNum)){
            var deadlineDate = new Date(t.boletoFecha + daysNum*86400000);
            var remaining = Math.ceil((deadlineDate.getTime()-Date.now())/86400000);
            countdown = remaining>0 ? remaining+' día'+(remaining===1?'':'s')+' restante'+(remaining===1?'':'s')
                      : remaining===0 ? 'Vence hoy' : 'Venció hace '+Math.abs(remaining)+' día'+(Math.abs(remaining)===1?'':'s');
            countdownColor = remaining<=3?'#A32D2D':remaining<=7?'#854F0B':'#085041';
          }
        }
        h += '<div class="task-row sub">'+
          '<div class="cb" id="cb-comp-boleto-'+c.id+'" style="'+(bDone?'background:#1D9E75;border-color:#1D9E75;':'')+'">'+
            (bDone?svgCheck():'')+
          '</div>'+
          '<div style="flex:1;">'+
            '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;" onclick="event.stopPropagation()">'+
              '<span class="ttext" style="flex-shrink:0;">Boleto en</span>'+
              '<input class="field-inp" type="text" placeholder="ej: 30" id="inp-comp-boleto-'+c.id+'" value="'+(t.dias==='NO'?'':t.dias)+'" '+
              'oninput="saveCompBoleto('+c.id+',this.value);updateCompBoletoCheck('+c.id+')" style="width:60px;'+(t.dias==='NO'?'display:none;':'')+'"/>'+
              (t.dias&&t.dias!=='NO'?'<span class="ttext" style="color:#666;flex-shrink:0;">días desde la reserva</span>':'')+
              '<button id="btn-no-comp-boleto-'+c.id+'" onclick="event.stopPropagation();toggleNoCompBoleto('+c.id+')" '+
              'style="height:28px;padding:0 10px;font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;border:1px solid '+(t.dias==='NO'?'#0F6E56':'#ddd')+';background:'+(t.dias==='NO'?'#E1F5EE':'#fff')+';color:'+(t.dias==='NO'?'#085041':'#666')+';">'+
              (t.dias==='NO'?'✓ Sin boleto':'Sin boleto')+'</button>'+
            '</div>'+
            (countdown?'<div style="margin-top:5px;display:inline-flex;align-items:center;gap:5px;background:'+(countdownColor==='#085041'?'#E1F5EE':countdownColor==='#854F0B'?'#FAEEDA':'#FCEBEB')+';border:1px solid '+(countdownColor==='#085041'?'#0F6E56':countdownColor==='#854F0B'?'#854F0B':'#E24B4A')+';padding:3px 10px;border-radius:20px;"><span style="font-size:12px;font-weight:700;color:'+countdownColor+';">⏱ '+countdown+'</span></div>':'')+
          '</div>'+
        '</div>';

      } else if(t.special === 'comp_escribano'){
        h += '<div class="task-row">'+
          '<div class="cb" id="cb-comp-esc-'+c.id+'" style="'+(t.escNombre?'background:#1D9E75;border-color:#1D9E75;':'')+'">'+
            (t.escNombre?svgCheck():'')+
          '</div>'+
          '<div style="flex:1;">'+
            '<span class="ttext" style="font-weight:600;">Escribano designado</span>'+
            '<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;" onclick="event.stopPropagation()">'+
              '<input type="text" placeholder="Nombre completo" value="'+(t.escNombre||'')+'" '+
              'style="flex:1;min-width:150px;font-size:12px;padding:4px 8px;height:28px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;" '+
              'oninput="saveCompEscribano('+c.id+',1,this.value)"/>'+
              '<input type="text" placeholder="Teléfono" value="'+(t.escTel||'')+'" '+
              'style="width:130px;font-size:12px;padding:4px 8px;height:28px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;" '+
              'oninput="saveCompEscribano('+c.id+',2,this.value)"/>'+
            '</div>'+
          '</div>'+
        '</div>';

      } else if(t.special === 'comp_terminada'){
        h += '<div class="task-row sub clickable '+(t.done?'done':'')+' '+'" onclick="toggleComp('+c.id+',\''+e.id+'\',\''+t.id+'\')">'+ 
          '<div class="cb" style="'+(t.done?'background:#1D9E75;border-color:#1D9E75;':'')+'">'+
            (t.done?svgCheck():'')+
          '</div>'+
          '<span class="ttext" style="font-weight:700;color:'+(t.done?'#085041':'#1a1a1a')+';">'+
            (t.done?'🥂 Operación terminada — '+c.fechaFin:'Operación terminada')+
          '</span>'+
        '</div>';

      } else if(t.special === 'comp_drive'){
        var driveUrl = t.driveUrl || '';
        var dDone = driveUrl.trim().length > 0;
        h += '<div class="task-row clickable">'+
          '<div class="cb" id="cb-comp-drive-'+c.id+'" style="'+(dDone?'background:#EF9F27;border-color:#EF9F27;':'')+'">'+
            (dDone?svgCheck():'')+
          '</div>'+
          '<div style="flex:1;">'+
            '<span class="ttext">Cargar reserva en Drive</span>'+
            '<div style="display:flex;gap:6px;align-items:center;margin-top:6px;" onclick="event.stopPropagation()">'+
              '<input type="text" placeholder="Pegá el link de Google Drive..." value="'+driveUrl+'" '+
              'style="flex:1;font-size:12px;padding:4px 8px;height:28px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;" '+
              'onchange="saveCompDrive('+c.id+',this.value)"/>'+
              (driveUrl ? '<a href="'+driveUrl+'" target="_blank" style="flex-shrink:0;height:28px;padding:0 10px;font-size:11px;font-weight:600;border-radius:8px;background:#FAEEDA;border:1px solid #854F0B;color:#633806;text-decoration:none;display:flex;align-items:center;white-space:nowrap;">Abrir Drive ↗</a>' : '')+
            '</div>'+
          '</div>'+
        '</div>';

      } else {
        h += '<div class="task-row clickable '+(t.done?'done':'')+' '+(t.sub?'sub':'')+' '+'" onclick="toggleComp('+c.id+',\''+e.id+'\',\''+t.id+'\')">'+
          '<div class="cb" style="'+(t.done?'background:'+e.fill+';border-color:'+e.fill+';':'')+'">'+
            (t.done?svgCheck():'')+
          '</div>'+
          '<span class="ttext">'+t.text+'</span>'+
        '</div>';
      }
    });
    h += '</div>';
  });

  h += '</div>';
  el.innerHTML = h;
}

// ── Modal nuevo comprador ─────────────────────────────────────────────────────


// ── TAREAS DIARIAS ────────────────────────────────────────────────────────────

const TAREAS_CATS = [
  { id:'agenda',   label:'Agenda',        color:'#534AB7', bg:'#EEEDFE' },
  { id:'admin',    label:'Admin',         color:'#185FA5', bg:'#E6F1FB' },
  { id:'clientes', label:'Clientes',      color:'#085041', bg:'#E1F5EE' },
  { id:'redes',    label:'Redes',         color:'#713c1d', bg:'#FAECE7' },
  { id:'prosp',    label:'Prospección',   color:'#633806', bg:'#FAEEDA' },
];

// Per-asesor tareas: { asesorId: { lastReset, tasks:[] } }
var tareasPerAsesor = {};
var tareasFiltro = 'all';
var tareasAsesorActivo = null; // null = no asesor seleccionado

function getDefaultTasks(){
  return [
    { id:'t1',  text:'Revisar correos y WhatsApp',           cat:'agenda',   done:false },
    { id:'t2',  text:'Planificar visitas del día',            cat:'agenda',   done:false },
    { id:'t3',  text:'Cargar propiedades al sistema',         cat:'admin',    done:false },
    { id:'t4',  text:'Actualizar CRM con novedades',          cat:'admin',    done:false },
    { id:'t5',  text:'Llamar a propietarios con consultas',   cat:'clientes', done:false },
    { id:'t6',  text:'Seguimiento de operaciones activas',    cat:'clientes', done:false },
    { id:'t7',  text:'Publicar contenido en Instagram',       cat:'redes',    done:false },
    { id:'t8',  text:'Responder consultas de portales',       cat:'prosp',    done:false },
    { id:'t9',  text:'Llamadas de prospección fría',          cat:'prosp',    done:false },
  ];
}

function getTareasState(aid){
  var key;
  if(aid && aid.startsWith('__')) {
    // Fallback key (email or admin)
    key = aid;
  } else {
    var a = asesores.find(function(x){return x.id===aid;});
    key = a ? a.name : (currentUserEmail || aid);
  }
  if(!tareasPerAsesor[key]){
    tareasPerAsesor[key] = { lastReset: toDay(), tasks: getDefaultTasks() };
  }
  return tareasPerAsesor[key];
}

function getMyTareasKey(){
  var me = getMyAsesor();
  return me ? me.name : (currentUserEmail||'admin');
}

// For backwards compat — always use active asesor's state
function getTareas(){
  if(!tareasAsesorActivo) return { lastReset: toDay(), tasks: [] };
  return getTareasState(tareasAsesorActivo);
}

// Save just the current user's tareas to Firebase immediately
function saveMiDia(){
  if(!currentUser || !window._fb) return;
  var fb = window._fb;
  fb.setDoc(fb.doc(fb.db,'tareas',currentUser.uid), {
    tareasPerAsesor: JSON.parse(JSON.stringify(tareasPerAsesor))
  });
}

function toggleTarea(id){
  var s = getTareas();
  var t = s.tasks.find(function(x){return x.id===id;});
  if(t){ t.done = !t.done; renderTareas(); }
}

function addTarea(){
  var txt = (document.getElementById('nueva-tarea-inp')||{value:''}).value.trim();
  var cat = (document.getElementById('nueva-tarea-cat')||{value:'agenda'}).value;
  if(!txt) return;
  getTareas().tasks.push({
    id: 't'+(Date.now()),
    text: txt,
    cat: cat,
    done: false,
    custom: true
  });
  document.getElementById('nueva-tarea-inp').value = '';
  renderTareas();
}

function resetTareas(){
  if(!confirm('¿Reiniciar todas las tareas del día?')) return;
  var s = getTareas();
  s.tasks.forEach(function(t){ t.done = false; });
  s.lastReset = toDay();
  renderTareas();
}

function deleteTarea(id){
  var s = getTareas();
  s.tasks = s.tasks.filter(function(t){return t.id!==id;});
  renderTareas();
}

function setTareasAsesor(aid){
  tareasAsesorActivo = aid;
  tareasFiltro = 'all';
  renderTareas();
}

function setTareaFiltro(f){
  tareasFiltro = f;
  renderTareas();
}
function setTareaFiltroBtn(el){
  setTareaFiltro(el.dataset.f);
}
function tareaCbClick(el){ toggleTarea(el.dataset.tid); }
function tareaDelClick(el){ deleteTarea(el.dataset.tid); }

function getCatInfo(id){
  return TAREAS_CATS.find(function(c){return c.id===id;}) || {label:id,color:'#888',bg:'#eee'};
}

function guardarMiDia(){
  saveMiDia();
  showSaveToast('✅ Mi día guardado');
  // Flash button green
  var btn = document.querySelector('#tab-tareas button[onclick="guardarMiDia()"]');
  if(btn){
    btn.textContent = '✅ Guardado';
    btn.style.background = '#0F6E56';
    setTimeout(function(){ btn.textContent = '💾 Guardar'; btn.style.background = '#185FA5'; }, 2000);
  }
}

function abrirEnCalendar(texto){
  // Build Google Calendar URL with task pre-filled for today
  var hoy = new Date();
  // Format: YYYYMMDD for all-day event
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var fecha = hoy.getFullYear()+pad(hoy.getMonth()+1)+pad(hoy.getDate());
  var manana = new Date(hoy); manana.setDate(manana.getDate()+1);
  var fechaFin = manana.getFullYear()+pad(manana.getMonth()+1)+pad(manana.getDate());
  var titulo = encodeURIComponent(texto);
  var detalle = encodeURIComponent('Tarea de Sessa Propiedades');
  return 'https://calendar.google.com/calendar/r/eventedit?text='+titulo+'&dates='+fecha+'/'+fechaFin+'&details='+detalle;
}

function renderTareas(){
  var el = document.getElementById('tareas-content'); if(!el) return;

  // For non-admins: always use their own asesor
  if(!isAdmin()){
    var me = getMyAsesor();
    if(me) tareasAsesorActivo = me.id;
    else if(!tareasAsesorActivo && asesores.length) tareasAsesorActivo = asesores[0].id;
    else if(!tareasAsesorActivo) tareasAsesorActivo = '__email__'+currentUserEmail;
  } else {
    if(!tareasAsesorActivo && asesores.length) tareasAsesorActivo = asesores[0].id;
    else if(!tareasAsesorActivo) tareasAsesorActivo = '__admin__';
  }

  var s = getTareas();

  var visible = tareasFiltro==='all'
    ? s.tasks
    : s.tasks.filter(function(t){return t.cat===tareasFiltro;});

  var pending   = visible.filter(function(t){return !t.done;});
  var completed = visible.filter(function(t){return t.done;});
  var total     = s.tasks.length;
  var done      = s.tasks.filter(function(t){return t.done;}).length;
  var pct       = total ? Math.round(done/total*100) : 0;
  var barColor  = pct===100 ? '#1D9E75' : pct>=50 ? '#EF9F27' : '#378ADD';

  // Date display
  var now = new Date();
  var fechaHoy = now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  fechaHoy = fechaHoy.charAt(0).toUpperCase() + fechaHoy.slice(1);

  var h = '';

  // Asesor selector — only for admin
  if(isAdmin()){
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:#fafaf8;border:1px solid #e8e5e0;border-radius:12px;align-items:center;">'+
      '<span style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;">Ver tareas de:</span>'+
      asesores.map(function(a){
        var active = tareasAsesorActivo===a.id;
        return '<button data-aid="'+a.id+'" onclick="setTareasAsesor(this.dataset.aid)" '+
          'style="height:30px;padding:0 14px;font-size:12px;font-weight:600;border-radius:20px;cursor:pointer;font-family:inherit;'+
          'border:1px solid '+(active?a.color:'#ddd')+';background:'+(active?a.color+'22':'#fff')+';color:'+(active?a.color:'#666')+';">'+
          a.name+'</button>';
      }).join('')+
    '</div>';
  }

  // Header
  h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">'+
    '<div>'+
      '<div style="font-size:18px;font-weight:700;color:#1a1a1a;">'+fechaHoy+'</div>'+
      '<div style="font-size:12px;color:#888;margin-top:2px;">Último reset: '+s.lastReset+'</div>'+
    '</div>'+
    '<div style="text-align:right;">'+
      '<div style="font-size:28px;font-weight:700;color:#1a1a1a;line-height:1;">'+done+'/'+total+'</div>'+
      '<div style="font-size:11px;color:#888;">completadas</div>'+
    '</div>'+
  '</div>';

  // Progress bar
  h += '<div style="height:6px;background:#eee;border-radius:3px;margin-bottom:16px;overflow:hidden;">'+
    '<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:3px;transition:width .3s;"></div>'+
  '</div>';

  // Celebration if all done
  if(pct===100 && total>0){
    h += '<div style="background:linear-gradient(135deg,#E1F5EE,#d4f0e4);border:1.5px solid #1D9E75;border-radius:12px;padding:14px 16px;text-align:center;margin-bottom:16px;">'+
      '<div style="font-size:28px;">🎉</div>'+
      '<div style="font-size:14px;font-weight:700;color:#085041;">¡Día completado! Buen trabajo</div>'+
    '</div>';
  }

  // Category filter pills
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">';
  h += '<button data-f="all" onclick="setTareaFiltroBtn(this)" style="height:26px;padding:0 12px;font-size:11px;font-weight:600;border-radius:20px;cursor:pointer;font-family:inherit;border:1px solid '+(tareasFiltro==='all'?'#185FA5':'#ddd')+';background:'+(tareasFiltro==='all'?'#E6F1FB':'#fff')+';color:'+(tareasFiltro==='all'?'#0C447C':'#666')+';">Todas</button>';
  TAREAS_CATS.forEach(function(cat){
    var active = tareasFiltro===cat.id;
    h += '<button data-f="'+cat.id+'" onclick="setTareaFiltroBtn(this)" style="height:26px;padding:0 12px;font-size:11px;font-weight:600;border-radius:20px;cursor:pointer;font-family:inherit;border:1px solid '+(active?cat.color:'#ddd')+';background:'+(active?cat.bg:'#fff')+';color:'+(active?cat.color:'#666')+';">'+cat.label+'</button>';
  });
  h += '</div>';

  // Task list — pending
  function taskHTML(t){
    var cat = getCatInfo(t.cat);
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid '+(t.done?'#e8e5e0':'#eee')+';border-radius:10px;margin-bottom:6px;background:#fff;opacity:'+(t.done?.45:1)+';">'+
      '<div data-tid="'+t.id+'" onclick="tareaCbClick(this)" style="width:16px;height:16px;border-radius:50%;border:2px solid '+(t.done?cat.color:'#ccc')+';flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:'+(t.done?cat.color:'transparent')+';">'+
        (t.done?svgCheck():'')+
      '</div>'+
      '<span data-tid="'+t.id+'" onclick="tareaCbClick(this)" style="flex:1;font-size:13px;color:#1a1a1a;'+(t.done?'text-decoration:line-through;':'')+'cursor:pointer;">'+t.text+'</span>'+
      '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:'+cat.bg+';color:'+cat.color+';">'+cat.label+'</span>'+
      '<a href="#" data-task="'+encodeURIComponent(t.text)+'" onclick="event.preventDefault();event.stopPropagation();window.open(abrirEnCalendar(decodeURIComponent(this.dataset.task)),\'_blank\')" title="Agregar a Google Calendar" '+
      'style="font-size:14px;text-decoration:none;color:var(--accent);padding:2px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);margin-left:4px;" >📅</a>'+
      (t.custom?'<button data-tid="'+t.id+'" onclick="tareaDelClick(this)" style="font-size:11px;color:#ccc;background:none;border:none;cursor:pointer;padding:0 2px;line-height:1;" title="Eliminar">✕</button>':'')+
    '</div>';
  }

  if(pending.length) h += pending.map(taskHTML).join('');

  if(completed.length){
    h += '<div style="font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;">Completadas</div>';
    h += completed.map(taskHTML).join('');
  }

  if(!visible.length){
    h += '<div class="no-sel">No hay tareas en esta categoría.</div>';
  }

  // Add new task
  h += '<div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #eee;">'+
    '<input id="nueva-tarea-inp" type="text" placeholder="Nueva tarea..." '+

var statsFilter = 'all'; // 'all' | 'year' | 'month-YYYY-MM'

function setStatsFilter(f){
  statsFilter = f;
  renderStats();
}

function propMatchesFilter(p){
  // Use ingreso date (when it entered the system)
  if(statsFilter === 'all') return true;
  var dateStr = p.ingreso || '';
  if(!dateStr) return statsFilter === 'all';
  var parts = dateStr.split('/');
  if(parts.length < 3) return false;
  var d = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  var now = new Date();
  if(statsFilter === 'year') return d.getFullYear() === now.getFullYear();
  if(statsFilter.startsWith('month-')){
    var ym = statsFilter.replace('month-','').split('-');
    return d.getFullYear()===parseInt(ym[0]) && (d.getMonth()+1)===parseInt(ym[1]);
  }
  return true;
}

function renderStats(){
  var el = document.getElementById('stats-content'); if(!el) return;

  var now = Date.now();
  var hoy = new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  var nowYear = new Date().getFullYear();
  var nowMonth = new Date().getMonth()+1;

  // Build month options from ingreso dates
  var monthSet = {};
  props.forEach(function(p){
    if(!p.ingreso) return;
    var parts = p.ingreso.split('/');
    if(parts.length<3) return;
    var key = parts[2]+'-'+parts[1];
    var label = new Date(parseInt(parts[2]),parseInt(parts[1])-1,1)
      .toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    monthSet[key] = label.charAt(0).toUpperCase()+label.slice(1);
  });
  var monthKeys = Object.keys(monthSet).sort().reverse();

  // ── Calcular métricas con filtro ──────────────────────────────────────────
  var filteredProps = props.filter(propMatchesFilter);
  var filteredComp  = compradores.filter(function(c){
    if(statsFilter==='all') return true;
    var dateStr = c.fechaReserva||'';
    if(!dateStr) return false;
    var parts = dateStr.split('/');
    if(parts.length<3) return false;
    var d = new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    if(statsFilter==='year') return d.getFullYear()===nowYear;
    if(statsFilter.startsWith('month-')){
      var ym=statsFilter.replace('month-','').split('-');
      return d.getFullYear()===parseInt(ym[0])&&(d.getMonth()+1)===parseInt(ym[1]);
    }
    return true;
  });

  var propsActivas     = filteredProps.filter(function(p){ return !p.finalizada; });
  var propsFinalizadas = filteredProps.filter(function(p){ return p.finalizada; });
  var compActivos      = filteredComp.filter(function(c){ return !c.finalizada; });
  var compFinalizados  = filteredComp.filter(function(c){ return c.finalizada; });

  // Por etapa
  var byEtapa = {pre:0, mkt:0, seg:0, cierre:0};
  propsActivas.forEach(function(p){ var s = stg(p); if(s) byEtapa[s.id] = (byEtapa[s.id]||0)+1; });

  // Por tipo
  var byTipo = {};
  props.forEach(function(p){ byTipo[p.tipo] = (byTipo[p.tipo]||0)+1; });

  // Inactivas +14d
  var inactivas = propsActivas.filter(function(p){ var d=diasSinContacto(p); return d!==null && d>=14; });

  // Sin contacto registrado
  var sinContacto = propsActivas.filter(function(p){ return !p.lastContacto; });

  // Estado precio
  var enPrecio=0, arribaP=0, fueraPrecio=0, sinEvaluar=0;
  propsActivas.forEach(function(p){
    var t = p.tasks && p.tasks.seg ? p.tasks.seg.find(function(x){return x.id==='seg_3';}) : null;
    var v = t ? t.precioVal : '';
    if(v==='en-precio') enPrecio++;
    else if(v==='arriba') arribaP++;
    else if(v==='fuera-precio') fueraPrecio++;
    else sinEvaluar++;
  });

  // Exclusivas
  var exclusivas = propsActivas.filter(function(p){
    var t = p.tasks && p.tasks.pre ? p.tasks.pre.find(function(x){return x.id==='pre_2';}) : null;
    return t && t.autoVal === 'exclusiva';
  });

  // Por asesor
  var byAsesor = {};
  asesores.forEach(function(a){ byAsesor[a.id] = {name:a.name, color:a.color, activas:0, fin:0, inac:0, cierre:0}; });
  propsActivas.forEach(function(p){
    // find by tokkoProducerName or asesorId
    var tkName = (p.tokkoProducerName||'').trim().toLowerCase();
    var a = asesores.find(function(x){ return x.name.trim().toLowerCase()===tkName; }) ||
            asesores.find(function(x){ return x.id===p.asesorId; });
    if(a && byAsesor[a.id]){
      byAsesor[a.id].activas++;
      var d = diasSinContacto(p); if(d!==null && d>=14) byAsesor[a.id].inac++;
      var s = stg(p); if(s && s.id==='cierre') byAsesor[a.id].cierre++;
    }
  });
  propsFinalizadas.forEach(function(p){
    var tkName = (p.tokkoProducerName||'').trim().toLowerCase();
    var a = asesores.find(function(x){ return x.name.trim().toLowerCase()===tkName; }) ||
            asesores.find(function(x){ return x.id===p.asesorId; });
    if(a && byAsesor[a.id]) byAsesor[a.id].fin++;
  });

  // Operaciones cerradas por mes (props + compradores)
  var mesesMap = {};
  propsFinalizadas.concat(compFinalizados).forEach(function(p){
    if(!p.fechaFin) return;
    var parts = p.fechaFin.split(' de ');
    if(parts.length<3) return;
    var key = parts[1]+' '+parts[2];
    mesesMap[key] = (mesesMap[key]||0)+1;
  });
  var meses = Object.keys(mesesMap).slice(-6);

  // ── HTML ──────────────────────────────────────────────────────────────────
  var h = '<div style="padding-bottom:40px;">';

    return '<button data-sf="'+val+'" onclick="setStatsFilter(this.dataset.sf)" style="height:28px;padding:0 12px;font-size:12px;font-weight:'+(active?'700':'500')+';border-radius:20px;cursor:pointer;font-family:inherit;border:1.5px solid '+(active?'#185FA5':'#ddd')+';background:'+(active?'#E6F1FB':'#fff')+';color:'+(active?'#0C447C':'#666')+';white-space:nowrap;">'+label+'</button>';
  }

  h += filterBtn('all', 'Desde siempre');
  h += filterBtn('year', 'Este año ('+nowYear+')');
  h += filterBtn('month-'+nowYear+'-'+String(nowMonth).padStart(2,'0'), 'Este mes');

  // Previous months
  monthKeys.slice(0,6).forEach(function(key){
    var ym = key.split('-');
    var curKey = nowYear+'-'+String(nowMonth).padStart(2,'0');
    if(key===curKey) return; // already shown as "Este mes"
    h += filterBtn('month-'+key, monthSet[key]);
  });

  h += '</div>';
  h += '<div style="font-size:11px;color:#aaa;margin-bottom:20px;">Actualizado: '+hoy+'</div>';

  // ── Fila 1: KPIs principales ──────────────────────────────────────────────
  function kpi(val, label, color, sub){
    return '<div style="flex:1;min-width:130px;background:#fff;border:1px solid #eee;border-radius:14px;padding:18px 16px;text-align:center;border-top:3px solid '+color+';">'+
      '<div style="font-size:32px;font-weight:800;color:'+color+';">'+val+'</div>'+
      '<div style="font-size:12px;color:#666;margin-top:4px;font-weight:600;">'+label+'</div>'+
      (sub?'<div style="font-size:10px;color:#aaa;margin-top:2px;">'+sub+'</div>':'')+
    '</div>';
  }

  h += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;">'+
    kpi(props.length, 'Propiedades totales', '#185FA5', propsActivas.length+' activas · '+propsFinalizadas.length+' cerradas')+
    kpi(exclusivas.length, 'Exclusivas activas', '#EF9F27', Math.round(exclusivas.length/Math.max(propsActivas.length,1)*100)+'% de la cartera')+
    kpi(inactivas.length, 'Inactivas +14d', '#E24B4A', 'sin contacto hace 2+ semanas')+
    kpi(compradores.length, 'Compradores', '#0F6E56', compActivos.length+' activos · '+compFinalizados.length+' cerrados')+
  '</div>';

  // ── Panel de metas / reservas ────────────────────────────────────────────
  var nowM = new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  var mesLabel = new Date().toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  mesLabel = mesLabel.charAt(0).toUpperCase()+mesLabel.slice(1);

  // Filter reservas by current period
  var reservasFiltradas = reservasLog.filter(function(r){
    if(statsFilter==='all') return true;
    if(statsFilter==='year') return r.mes && r.mes.startsWith(String(new Date().getFullYear()));
    if(statsFilter.startsWith('month-')) return r.mes === statsFilter.replace('month-','');
    return true;
  });
  var resActivas    = reservasFiltradas.filter(function(r){return r.estado==='activa';});
  var resCayeron    = reservasFiltradas.filter(function(r){return r.estado==='cayó';});
  var resEscrituradas = reservasFiltradas.filter(function(r){return r.estado==='escriturada';});
  var metaPct = Math.min(100, Math.round(reservasFiltradas.length/Math.max(metaMensual,1)*100));
  var metaColor = metaPct>=100?'#1D9E75':metaPct>=66?'#EF9F27':'#185FA5';

  h += '<div style="background:#fff;border:1px solid #eee;border-radius:14px;padding:20px;margin-bottom:24px;">'+

  var sortedTipos = Object.keys(byTipo).sort(function(a,b){return byTipo[b]-byTipo[a];});
  sortedTipos.forEach(function(tipo){

  });
  h += '</div></div>';

  // ── Fila 5: Alertas ───────────────────────────────────────────────────────
  if(inactivas.length || sinContacto.length){
    h += '<div style="background:#fff;border:1px solid #E24B4A33;border-radius:14px;padding:20px;margin-bottom:24px;">'+

function copyInforme(){
  var t = document.getElementById('informe-txt');
  if(!t) return;
  navigator.clipboard.writeText(t.value).then(function(){
    var b = document.querySelector('#informe-overlay .resumen-actions button:last-child');
    if(b){ b.textContent='Copiado!'; b.style.background='#E1F5EE'; b.style.borderColor='#0F6E56'; b.style.color='#085041';
      setTimeout(function(){ b.textContent='Copiar'; b.style.background='#E6F1FB'; b.style.borderColor='#185FA5'; b.style.color='#0C447C'; }, 2000); }
  }).catch(function(){ t.select(); document.execCommand('copy'); });
}

function cambiarEstadoReserva(rid, estado){
  var r = reservasLog.find(function(x){return String(x.id)===String(rid);});
  if(r){ r.estado = estado; saveMeta(); renderStats(); }
}

function closeInformeModal(){
  var el = document.getElementById('informe-overlay');
  if(el) el.remove();
}

function generarInforme(){
  var now = new Date();
  var periodoLabel = statsFilter==='all' ? 'Histórico completo' :
                     statsFilter==='year' ? 'Año '+now.getFullYear() :
                     statsFilter.startsWith('month-') ?
                       (function(){ var ym=statsFilter.replace('month-','').split('-');
                         var d = new Date(parseInt(ym[0]),parseInt(ym[1])-1,1);
                         var l = d.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
                         return l.charAt(0).toUpperCase()+l.slice(1); })() : 'Período';

  var filteredProps = props.filter(propMatchesFilter);
  var propsActivas     = filteredProps.filter(function(p){ return !p.finalizada; });
  var propsFinalizadas = filteredProps.filter(function(p){ return p.finalizada; });

  var filteredComp = compradores.filter(function(c){
    if(statsFilter==='all') return true;
    var dateStr = c.fechaReserva||''; if(!dateStr) return false;
    var parts = dateStr.split('/'); if(parts.length<3) return false;
    var d = new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    var ny = now.getFullYear(), nm = now.getMonth()+1;
    if(statsFilter==='year') return d.getFullYear()===ny;
    if(statsFilter.startsWith('month-')){
      var ym=statsFilter.replace('month-','').split('-');
      return d.getFullYear()===parseInt(ym[0])&&(d.getMonth()+1)===parseInt(ym[1]);
    }
    return true;
  });
  var compFinalizados = filteredComp.filter(function(c){ return c.finalizada; });

  // Inactivas
  var inactivas = propsActivas.filter(function(p){ var d=diasSinContacto(p); return d!==null&&d>=14; });

  // Estado precio
  var enPrecio=0, fueraPrecio=0;
  propsActivas.forEach(function(p){
    var t = p.tasks&&p.tasks.seg ? p.tasks.seg.find(function(x){return x.id==='seg_3';}) : null;
    if(t&&t.precioVal==='en-precio') enPrecio++;
    if(t&&t.precioVal==='fuera-precio') fueraPrecio++;
  });

  // Exclusivas
  var exclusivas = propsActivas.filter(function(p){
    var t = p.tasks&&p.tasks.pre ? p.tasks.pre.find(function(x){return x.id==='pre_2';}) : null;
    return t&&t.autoVal==='exclusiva';
  });

  // Por asesor
  var asesorLines = '';
  asesores.forEach(function(a){
    var tkName = a.name.trim().toLowerCase();
    var mis = filteredProps.filter(function(p){
      return (p.tokkoProducerName||'').trim().toLowerCase()===tkName ||
             p.asesorId===a.id;
    });
    var act = mis.filter(function(p){return !p.finalizada;}).length;
    var fin = mis.filter(function(p){return p.finalizada;}).length;
    var inac = mis.filter(function(p){var d=diasSinContacto(p);return !p.finalizada&&d!==null&&d>=14;}).length;
    if(act>0||fin>0){
      asesorLines += '👤 '+a.name+': '+act+' activa'+(act!==1?'s':'');
      if(fin>0) asesorLines += ' · '+fin+' cerrada'+(fin!==1?'s':'');
      if(inac>0) asesorLines += ' · ⚠ '+inac+' inactiva'+(inac!==1?'s':'');
      asesorLines += '\n';
    }
  });

  // Pipeline
  var byEtapa = {pre:0,mkt:0,seg:0,cierre:0};
  propsActivas.forEach(function(p){ var s=stg(p); if(s) byEtapa[s.id]=(byEtapa[s.id]||0)+1; });

  var fechaHoy = now.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});

  var sep = '------------------------';
  var informe = [
    'INFORME SESSA PROPIEDADES',
    periodoLabel + ' - ' + fechaHoy,
    sep,
    '',
    'RESUMEN GENERAL',
    '- Propiedades activas: ' + propsActivas.length,
    '- Operaciones cerradas: ' + (propsFinalizadas.length + compFinalizados.length),
    '- Compradores activos: ' + filteredComp.filter(function(c){return !c.finalizada;}).length,
    '- Exclusivas en cartera: ' + exclusivas.length,
    '',
    'PIPELINE',
    '- Pre-Listing: ' + byEtapa.pre,
    '- Produccion y Marketing: ' + byEtapa.mkt,
    '- Seguimiento: ' + byEtapa.seg,
    '- En cierre: ' + byEtapa.cierre,
    '',
    'ESTADO DE PRECIOS',
    '- En precio: ' + enPrecio,
    '- Fuera de precio: ' + fueraPrecio,
    '',
    'POR ASESOR',
    asesorLines.trim(),
  ];
  if(inactivas.length){
    informe.push('');
    informe.push('ALERTAS');
    informe.push('- ' + inactivas.length + ' propiedad' + (inactivas.length!==1?'es':'') + ' sin contacto hace +14 dias');
  }
  informe.push('');
  informe.push(sep);
  informe.push('Generado desde Sessa Propiedades Tracker');
  informe = informe.join('\n');

  // Show modal with copy button
  var existing = document.getElementById('informe-overlay');
  if(existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'informe-overlay';
  overlay.className = 'resumen-overlay';
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML =
    '<div class="resumen-modal" style="max-width:520px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'+
