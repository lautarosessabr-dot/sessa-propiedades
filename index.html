// ── CAPTACIONES ───────────────────────────────────────────────────────────────

var captaciones = [];
var nextCapId = 1;
var reservasLog = [];
var visitasDB    = [];
var busquedas   = []; // active property searches
var metaMensual = 3; // default meta
var activeCap = null;

function mkCaptacion(id, d){
  return {
    id:       id,
    nombre:   d.nombre   || '',
    telefono: d.telefono || '',
    mail:     d.mail     || '',
    asesorId: d.asesorId || '',
    asesorName: d.asesorName || '',
    createdAt: d.createdAt || Date.now(),  // timestamp of creation
    comentarios: d.comentarios || '',
    estado:   d.estado   || 'activa',  // activa | captada | perdida
  };
}

function diasRestantesCap(c){
  var week = 7 * 24 * 60 * 60 * 1000;
  var elapsed = Date.now() - c.createdAt;
  var remaining = Math.ceil((week - elapsed) / 86400000);
  return remaining;
}

function renovarCap(id){
  var c = captaciones.find(function(x){return x.id===id;}); if(!c) return;
  c.createdAt = Date.now();
  saveCap(c);
  renderCaptaciones();
  renderCapDetail();
}

function cerrarCap(id, estadoCode){
  var c = captaciones.find(function(x){return x.id===id;}); if(!c) return;
  var estados = {1:'activa', 2:'captada', 3:'perdida'};
  var estado = estados[estadoCode] || 'activa';
  c.estado = estado;
  activeCap = null;
  saveCap(c);
  renderCaptaciones();
  renderCapDetail();
}

function eliminarCap(id){
  // Only admin can fully delete; others just archive
  if(isAdmin()){
    if(!confirm('¿Eliminar permanentemente esta captación?')) return;
    captaciones = captaciones.filter(function(x){return x.id!==id;});
    deleteCapDoc(id);
    if(activeCap===id) activeCap=null;
  } else {
    if(!confirm('¿Archivar esta captación?')) return;
    var c = captaciones.find(function(x){return x.id===id;});
    if(c){ c.estado='perdida'; saveCap(c); }
    if(activeCap===id) activeCap=null;
  }
  renderCaptaciones();
  renderCapDetail();
}

function openCap(id){
  activeCap = activeCap===id ? null : id;
  renderCaptaciones();
  renderCapDetail();
}

function saveNewCaptacion(){
  var nombre = document.getElementById('cap-nombre').value.trim();
  if(!nombre){ document.getElementById('cap-err').textContent='El nombre es obligatorio'; return; }
  var me = getMyAsesor();
  var asesorId   = me ? me.id   : (asesores[0]?asesores[0].id:'');
  var asesorName = me ? me.name : (asesores[0]?asesores[0].name:'');
  // Admin can pick asesor
  var selAsesor = document.getElementById('cap-asesor');
  if(isAdmin() && selAsesor && selAsesor.value){
    var found = asesores.find(function(a){return a.id===selAsesor.value;});
    if(found){ asesorId=found.id; asesorName=found.name; }
  }
  var nid = nextCapId++;
  var newCap = mkCaptacion(nid, {
    nombre:   nombre,
    telefono: document.getElementById('cap-tel').value.trim(),
    mail:     document.getElementById('cap-mail').value.trim(),
    comentarios: document.getElementById('cap-comentarios').value.trim(),
    asesorId: asesorId,
    asesorName: asesorName,
  });
  captaciones.unshift(newCap);
  activeCap = nid;
  closeCapModal();
  saveCap(newCap);
  saveMeta();
  renderCaptaciones();
  renderCapDetail();
}

    '<div class="form-group"><label>Asesor</label><select id="cap-asesor">'+

      '<div class="modal-title">Nueva captación</div>'+
      '<div class="form-grid">'+
        '<div class="form-group" style="grid-column:1/-1;"><label>Nombre completo *</label>'+
          '<input id="cap-nombre" type="text" placeholder="ej: Carlos García"/><span class="err" id="cap-err"></span></div>'+
        '<div class="form-group"><label>Teléfono</label><input id="cap-tel" type="text" placeholder="ej: 221 123 4567"/></div>'+

function closeCapModal(){

function saveCaptacionField(id, fieldCode, val){
  var c = captaciones.find(function(x){return x.id===id;}); if(!c) return;
  var fields = {1:'telefono', 2:'mail', 3:'comentarios'};
  var field = fields[fieldCode];
  if(field){ c[field] = val; saveCap(c); }
}

function renderCaptaciones(){
  var el = document.getElementById('captaciones-content'); if(!el) return;

  // Admin: ve todas (solo lectura). Asesor: ve solo las suyas.
  var me = getMyAsesor();
  var visible = captaciones.filter(function(c){
    if(isAdmin()) return true;
    if(!me) return false;
    if(c.asesorId && c.asesorId === me.id) return true;
    if(c.asesorName && me.name && c.asesorName.trim().toLowerCase() === me.name.trim().toLowerCase()) return true;
    return false;
  });

  var activas  = visible.filter(function(c){return c.estado==='activa';});
  var cerradas = visible.filter(function(c){return c.estado!=='activa';});

  var h = '<div id="cap-modal-area"></div>';

  // Toolbar
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'+
    '<div style="font-size:13px;font-weight:700;color:#1a1a1a;">'+activas.length+' captación'+(activas.length!==1?'es':'')+' activa'+(activas.length!==1?'s':'')+
    (cerradas.length?' <span style="color:#aaa;font-weight:400;font-size:12px;">· '+cerradas.length+' cerrada'+(cerradas.length!==1?'s':'')+'</span>':'')+
    '</div>'+
    '<button class="btn btn-primary" onclick="openCapModal()">+ Nueva captación</button>'+
  '</div>';

  // Admin search bar
  var searchCap = document.getElementById('cap-search-inp') ? document.getElementById('cap-search-inp').value.toLowerCase() : '';

  if(!activas.length && !cerradas.length){
    h += '<div class="no-sel">No hay captaciones. Agregá una con el botón de arriba.</div>';
    h += '<div id="cap-detail"></div>';
    el.innerHTML = h;
    return;
  }

  // Admin archive search
  if(isAdmin()){
    h += '<div style="margin-bottom:14px;display:flex;gap:8px;align-items:center;">'+
      '<input id="cap-search-inp" type="text" placeholder="Buscar en archivo por nombre, teléfono o email..." value="'+searchCap+'" '+
      'oninput="renderCaptaciones()" '+
      'style="flex:1;height:34px;padding:0 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;"/>'+
    '</div>';
  }

  // Grid
  function capCard(c){
    var dias = diasRestantesCap(c);
    var vencida = dias <= 0;
    var urgente = dias > 0 && dias <= 3;
    var ok = dias > 3;
    var borderColor = c.estado!=='activa' ? '#ddd' : vencida ? '#E24B4A' : urgente ? '#E24B4A' : '#eee';
    var bgColor = c.estado!=='activa' ? '#fafaf8' : vencida ? '#FFF5F5' : urgente ? '#FFF5F5' : '#fff';
    var a = asesores.find(function(x){return x.id===c.asesorId;}) || {name:c.asesorName||'—',color:'#888'};

    var timerLabel = c.estado!=='activa' ?
      '<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:'+(c.estado==='captada'?'#E1F5EE':'#f0ede8')+';color:'+(c.estado==='captada'?'#085041':'#888')+';font-weight:600;">'+(c.estado==='captada'?'✅ Captada':'❌ Perdida')+'</span>' :
      '<span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;background:'+(vencida?'#FCEBEB':urgente?'#FCEBEB':'#E1F5EE')+';color:'+(vencida?'#A32D2D':urgente?'#A32D2D':'#085041')+';">'+
        (vencida?'Vencida':'⏱ '+dias+'d restante'+(dias!==1?'s':''))+
      '</span>';

    return '<div class="pcard'+(activeCap===c.id?' active':'')+'" onclick="openCap('+c.id+')" '+
      'style="border-color:'+borderColor+';background:'+bgColor+';">'+
      '<div class="pcard-top">'+
        '<span class="asesor-badge" style="background:'+a.color+'22;color:'+a.color+';">'+a.name+'</span>'+
        timerLabel+
      '</div>'+
      '<div class="pcard-addr" style="font-size:14px;">'+c.nombre+'</div>'+
      (c.telefono?'<div class="pcard-owner">📞 '+c.telefono+'</div>':'')+
      (c.mail?'<div class="pcard-owner" style="color:#888;">✉ '+c.mail+'</div>':'')+
      (c.comentarios?'<div style="font-size:11px;color:#888;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+c.comentarios.substring(0,60)+'...</div>':'')+
    '</div>';
  }

  h += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  // Left: cards
  h += '<div style="flex:1;min-width:260px;">';
  if(activas.length) h += '<div class="grid">'+activas.map(capCard).join('')+'</div>';
  // Archivo (cerradas) — with search filter for admin
  if(cerradas.length || searchCap){
    var archivoVisible = isAdmin() && searchCap
      ? captaciones.filter(function(c){
          var q = searchCap;
          return c.estado!=='activa' && (
            c.nombre.toLowerCase().includes(q) ||
            (c.telefono||'').toLowerCase().includes(q) ||
            (c.mail||'').toLowerCase().includes(q) ||
            (c.comentarios||'').toLowerCase().includes(q)
          );
        })
      : cerradas;

    if(archivoVisible.length){
      h += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #eee;">'+
        '<div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">'+
          (searchCap ? 'Resultados de búsqueda ('+archivoVisible.length+')' : '📁 Archivo ('+archivoVisible.length+')')+
        '</div>';

      // Show as compact list for archive
      archivoVisible.forEach(function(c){
        var a = asesores.find(function(x){return x.id===c.asesorId;}) || {name:c.asesorName||'—',color:'#888'};
        var estadoBadge = c.estado==='captada'
          ? '<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:#E1F5EE;color:#085041;font-weight:700;">✅ Captada</span>'
          : '<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:#f0ede8;color:#888;font-weight:600;">❌ Perdida</span>';
        var createdDate = new Date(c.createdAt).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
        h += '<div class="pcard'+(activeCap===c.id?' active':'')+'" onclick="openCap('+c.id+')" '+
          'style="opacity:.75;display:flex;align-items:center;gap:10px;padding:10px 14px;">'+
          '<div style="flex:1;">'+
            '<div style="font-size:13px;font-weight:600;color:#1a1a1a;">'+c.nombre+'</div>'+
            '<div style="font-size:11px;color:#888;">'+
              (c.telefono?'📞 '+c.telefono+' · ':'')+
              (c.mail?'✉ '+c.mail+' · ':'')+
              a.name+' · '+createdDate+
            '</div>'+
          '</div>'+
          estadoBadge+
        '</div>';
      });
      h += '</div>';
    }
  }
  h += '</div>';

  // Right: detail
  h += '<div id="cap-detail" style="flex:1.5;min-width:300px;"></div>';
  // Admin export button
  if(isAdmin() && captaciones.length){
    h += '<div style="margin-top:24px;text-align:center;">'+
      '<button onclick="exportarBasePropietarios()" '+
      'style="height:34px;padding:0 18px;font-size:12px;font-weight:600;border:1px solid #185FA5;border-radius:8px;background:#E6F1FB;color:#0C447C;cursor:pointer;font-family:inherit;">'+
      '📋 Exportar base de propietarios</button>'+
    '</div>';
  }

  h += '</div>';

  el.innerHTML = h;
  renderCapDetail();
}

function descargarHTML(){
  var html = document.documentElement.outerHTML;
  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var fecha = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
  a.href = url;
  a.download = 'sessa_tracker_'+fecha+'.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportarBackupExcel(){
  if(typeof XLSX === 'undefined'){ alert('Error: librería XLSX no cargada. Recargá la página.'); return; }

  var wb = XLSX.utils.book_new();
  var fecha = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');

  // ── Hoja 1: Propiedades ────────────────────────────────────────────────────
  var propsData = [['Dirección','Tipo','Asesor','Tokko Producer','Propietario','Teléfono','Precio actual','Precio ingreso','Publicación','Web','Apto banco','Cartel','Fecha ingreso','Último contacto','Etapa','% Avance','Exclusiva','Estado precio','Finalizada','Fecha cierre','Observaciones']];
  props.forEach(function(p){
    var a = getA(p.asesorId);
    var s = stg(p);
    var autoTask = p.tasks&&p.tasks.pre ? p.tasks.pre.find(function(x){return x.id==='pre_2';}) : null;
    var precioTask = p.tasks&&p.tasks.seg ? p.tasks.seg.find(function(x){return x.id==='seg_3';}) : null;
    propsData.push([
      p.addr, p.tipo, a.name, p.tokkoProducerName||'',
      p.propietario, p.telefono, p.precio, p.precioIngreso||'',
      p.publicacion, p.web||'', p.aptoBanco?'Sí':'No', p.cartel?'Sí':'No',
      p.ingreso||'', p.lastContacto||'',
      s ? s.label : '', calcPct(p)+'%',
      autoTask&&autoTask.autoVal==='exclusiva'?'Exclusiva':'No exclusiva',
      precioTask&&precioTask.precioVal ? precioTask.precioVal : 'Sin evaluar',
      p.finalizada?'Sí':'No', p.fechaFin||'',
      p.observaciones||''
    ]);
  });
  var wsProps = XLSX.utils.aoa_to_sheet(propsData);
  wsProps['!cols'] = [28,10,14,16,16,14,14,14,12,6,10,7,14,14,16,8,12,14,10,12,30].map(function(w){return {wch:w};});
  XLSX.utils.book_append_sheet(wb, wsProps, 'Propiedades');

  // ── Hoja 2: Compradores ────────────────────────────────────────────────────
  var compData = [['Nombre','Teléfono','Asesor','Propiedad reservada','Tipo','Precio','Inmobiliaria','Fecha reserva','Último contacto','% Avance','Finalizada','Fecha cierre','Observaciones']];
  compradores.forEach(function(c){
    var a = getA(c.asesorId);
    compData.push([
      c.nombre, c.telefono||'', a.name,
      c.propAddr||'', c.propTipo||'', c.propPrecio||'', c.inmo||'',
      c.fechaReserva||'', c.lastContacto||'',
      calcPctComp(c)+'%',
      c.finalizada?'Sí':'No', c.fechaFin||'',
      c.observaciones||''
    ]);
  });
  var wsComp = XLSX.utils.aoa_to_sheet(compData);
  wsComp['!cols'] = [18,14,14,24,10,14,16,14,14,8,10,12,30].map(function(w){return {wch:w};});
  XLSX.utils.book_append_sheet(wb, wsComp, 'Compradores');

  // ── Hoja 3: Captaciones ────────────────────────────────────────────────────
  var capData = [['Nombre','Teléfono','Email','Asesor','Estado','Fecha creación','Días restantes','Plan de captación']];
  captaciones.forEach(function(c){
    var a = asesores.find(function(x){return x.id===c.asesorId;})||{name:c.asesorName||'—'};
    var dias = diasRestantesCap(c);
    var createdDate = new Date(c.createdAt).toLocaleDateString('es-AR');
    capData.push([
      c.nombre, c.telefono||'', c.mail||'', a.name,
      c.estado==='captada'?'Captada':c.estado==='perdida'?'Perdida':'Activa',
      createdDate,
      c.estado==='activa' ? dias : '—',
      c.comentarios||''
    ]);
  });
  var wsCap = XLSX.utils.aoa_to_sheet(capData);
  wsCap['!cols'] = [20,14,24,14,10,14,12,40].map(function(w){return {wch:w};});
  XLSX.utils.book_append_sheet(wb, wsCap, 'Captaciones');

  // ── Hoja 4: Asesores ──────────────────────────────────────────────────────
  var asesData = [['Nombre','Email','Propiedades activas','Propiedades cerradas']];
  asesores.forEach(function(a){
    var act = props.filter(function(p){ return !p.finalizada && ((p.tokkoProducerName||'').trim().toLowerCase()===a.name.trim().toLowerCase()||p.asesorId===a.id); }).length;

  var wsAses = XLSX.utils.aoa_to_sheet(asesData);

  // ── Hoja 5: Notas del equipo (comentarios por propiedad) ────────────────────
  var notasData = [['Propiedad','Asesor autor','Nota','Fecha']];
  props.forEach(function(p){
    if(!p.comentarios||!p.comentarios.length) return;
    p.comentarios.forEach(function(c){
      notasData.push([p.addr, c.asesorName||'', c.texto||'', c.fecha||'']);

  if(notasData.length>1){
    var wsNotas = XLSX.utils.aoa_to_sheet(notasData);
    wsNotas['!cols'] = [{wch:28},{wch:16},{wch:50},{wch:16}];

    });
  });
  // Also from visitasDB
  visitasDB.forEach(function(v){
    var already = visData.find(function(r){ return r[0]===v.nombre&&r[4]===v.fecha&&r[5]===v.propAddr; });
    if(!already){
      var resLabel = v.resultado==='interesado'?'Muy interesado':v.resultado==='dudoso'?'Dudoso':'Descartado';
      visData.push([v.nombre||'',v.telefono||'',resLabel,v.nota||'',v.fecha||'',v.propAddr||'',v.propTipo||'',v.propPrecio||'',v.asesorName||'']);
    }
  });
  if(visData.length>1){
    var wsVis = XLSX.utils.aoa_to_sheet(visData);
    wsVis['!cols'] = [{wch:20},{wch:14},{wch:14},{wch:30},{wch:12},{wch:28},{wch:10},{wch:14},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsVis, 'Visitas');
  }

  // ── Hoja 7: Búsquedas activas ─────────────────────────────────────────────
  var bqData = [['Cliente','Teléfono','Estado','Asesor','Fecha','Texto búsqueda','Sugerencias']];
  busquedas.forEach(function(b){
    var a = asesores.find(function(x){return x.id===b.asesorId;})||{name:b.asesorName||'—'};
    var sugs = (b.sugerencias||[]).map(function(s){ return s.link+(s.nota?' ('+s.nota+')':''); }).join(' | ');
    bqData.push([b.nombre||'',b.telefono||'',b.estado||'',a.name,b.fecha||'',b.texto||'',sugs]);
  });
  if(bqData.length>1){
    var wsBq = XLSX.utils.aoa_to_sheet(bqData);
    wsBq['!cols'] = [{wch:20},{wch:14},{wch:10},{wch:16},{wch:12},{wch:40},{wch:50}];
    XLSX.utils.book_append_sheet(wb, wsBq, 'Busquedas activas');
  }

  // ── Hoja 8: Reservas ──────────────────────────────────────────────────────
  if(reservasLog.length){
    var resData = [['Propiedad','Asesor','Fecha','Estado','Mes']];
    reservasLog.forEach(function(r){
      resData.push([r.propAddr||'',r.asesorName||'',r.fecha||'',r.estado||'',r.mes||'']);
    });
    var wsRes = XLSX.utils.aoa_to_sheet(resData);
    wsRes['!cols'] = [{wch:28},{wch:16},{wch:12},{wch:14},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsRes, 'Reservas');
  }

  // ── Descargar ──────────────────────────────────────────────────────────────
  XLSX.writeFile(wb, 'Sessa_Backup_'+fecha+'.xlsx');
}

function exportarBasePropietarios(){
  var lines = ['BASE DE PROPIETARIOS - SESSA PROPIEDADES'];
  lines.push(new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}));
  lines.push('------------------------');
  lines.push('');

  // Group by estado
  var captadas = captaciones.filter(function(c){return c.estado==='captada';});
  var activas  = captaciones.filter(function(c){return c.estado==='activa';});
  var perdidas = captaciones.filter(function(c){return c.estado==='perdida';});

  function formatCap(c){
    var a = asesores.find(function(x){return x.id===c.asesorId;})||{name:c.asesorName||'—'};
    var d = new Date(c.createdAt).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
    var line = c.nombre;
    if(c.telefono) line += ' | Tel: '+c.telefono;
    if(c.mail)     line += ' | Mail: '+c.mail;
    line += ' | Asesor: '+a.name+' | '+d;
    if(c.comentarios) line += ' | Nota: '+c.comentarios;
    return line;
  }

  if(captadas.length){
    lines.push('CAPTADAS ('+captadas.length+')');
    captadas.forEach(function(c){ lines.push('• '+formatCap(c)); });
    lines.push('');
  }
  if(activas.length){
    lines.push('EN PROCESO ('+activas.length+')');
    activas.forEach(function(c){ lines.push('• '+formatCap(c)); });
    lines.push('');
  }
  if(perdidas.length){
    lines.push('PERDIDAS ('+perdidas.length+')');
    perdidas.forEach(function(c){ lines.push('• '+formatCap(c)); });
  }

  lines.push('');
  lines.push('------------------------');
  lines.push('Generado desde Sessa Propiedades Tracker');

  var txt = lines.join('\n');


  var overlay = document.createElement('div');
  overlay.className = 'resumen-overlay';
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML =
    '<div class="resumen-modal" style="max-width:560px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'+
        '<h3 style="font-size:15px;font-weight:700;color:#1a1a1a;">📋 Base de propietarios</h3>'+
        '<button onclick="closeExportModal(this)" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;">×</button>'+
      '</div>'+
      '<textarea class="resumen-textarea" rows="16" style="font-family:monospace;font-size:11px;line-height:1.6;background:#fafaf8;">'+txt+'</textarea>'+
      '<div class="resumen-actions" style="margin-top:10px;">'+
        '<button onclick="closeExportModal(this)" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;">×</button>'+
      '<button onclick="copyBasePropietarios(this)" style="height:34px;padding:0 16px;font-size:12px;font-weight:700;border:1px solid #185FA5;border-radius:8px;background:#E6F1FB;color:#0C447C;cursor:pointer;font-family:inherit;">Copiar</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
}

  renderBusquedas();
}

function agregarSugerencia(bid){
  var b = busquedas.find(function(x){ return x.id===bid; }); if(!b) return;
  var linkEl = document.getElementById('sug-link-'+bid);
  var notaEl = document.getElementById('sug-nota-'+bid);
  if(!linkEl) return;
  var link = linkEl.value.trim();
  if(!link){ alert('Pegá un link'); return; }
  if(!link.startsWith('http')) link = 'https://'+link;

  var me = getMyAsesor();
  var asesorId   = me ? me.id   : 'admin';
  var asesorName = me ? me.name : 'Admin';
  var today = new Date();
  var fecha = String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+today.getFullYear();

  if(!b.sugerencias) b.sugerencias = [];
  b.sugerencias.push({
    id:         Date.now(),
    link:       link,
    titulo:     link.length > 50 ? link.substring(0,50)+'...' : link,
    nota:       notaEl ? notaEl.value.trim() : '',
    asesorId:   asesorId,
    asesorName: asesorName,
    fecha:      fecha,
  });

  saveBusqueda(b);
  renderBusquedas();
}

function eliminarSugerencia(bid, sid){
  var b = busquedas.find(function(x){ return x.id===bid; }); if(!b) return;
  b.sugerencias = (b.sugerencias||[]).filter(function(s){ return s.id !== sid; });
  saveBusqueda(b);
  renderBusquedas();
}

function cambiarEstadoBusqueda(bid, estado){
  var b = busquedas.find(function(x){ return String(x.id)===String(bid); });
  if(b){ b.estado = estado; saveBusqueda(b); renderBusquedas(); }
}

function renderAsesores(){
  const el = document.getElementById('asesor-list-el'); if(!el) return;
  if(!asesores.length){ el.innerHTML='<div class="no-sel">No hay asesores.</div>'; return; }
  el.innerHTML = '<div class="asesor-list">'+asesores.map(a=>{
    const cnt = props.filter(p=>p.asesorId===a.id&&!p.finalizada).length;
    const fin = props.filter(p=>p.asesorId===a.id&&p.finalizada).length;
    return '<div class="asesor-row">'+
      '<div class="asesor-info"><div class="asesor-color" style="background:'+a.color+';"></div>'+
      '<div><div class="asesor-name">'+a.name+'</div>'+
      '<div class="asesor-count">'+cnt+' propiedad'+(cnt!==1?'es':'')+' activa'+(cnt!==1?'s':'')+' · '+fin+' finalizada'+(fin!==1?'s':'')+'</div></div></div>'+
      '<button class="btn btn-danger" onclick="delAsesor(\''+a.id+'\')">Eliminar</button></div>';

}

var TOKKO_KEY = 'a816281c7b5e042cf4b63ce93dae3b4ff5817c7e';

var TOKKO_TIPO_MAP = {
  'Departamento': 'Dpto', 'Casa': 'Casa', 'PH': 'PH', 'Local': 'Local',
  'Lote': 'Lote', 'Galpon': 'Galpon', 'Oficina': 'Local', 'Terreno': 'Lote',
  'Monoambiente': 'Monoambiente', 'Cochera': 'Lote'
};

async function importarDesdeTokko(){
  var btn = document.getElementById('btn-tokko-import');
  btn.textContent = '⏳ Cargando...'; btn.disabled = true;

  try {
    var url = 'https://www.tokkobroker.com/api/v1/property/?key='+TOKKO_KEY+'&format=json&limit=200&lang=es_ar&current_status=2';
    var res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    var items = data.objects || [];
    // Import all properties from Tokko

    if(!items.length){
      alert('No se encontraron propiedades en Tokko.');
      btn.textContent = '🔄 Importar desde Tokko'; btn.disabled = false;
      return;
    }

    // Auto-create asesores from Tokko producers if they don't exist yet
    var producersAdded = 0;
    var seenProducers = {};
    items.forEach(function(p){
      if(!p.producer || !p.producer.name) return;
      var pName = p.producer.name.trim();
      var pEmail = p.producer.email ? p.producer.email.trim().toLowerCase() : '';
      if(seenProducers[pName]) return;
      seenProducers[pName] = true;
      // Check if asesor already exists by name or email
      var exists = asesores.find(function(a){
        var aName = a.name.trim().toLowerCase();
        var aEmail = (a.email||'').trim().toLowerCase();
        return aName === pName.toLowerCase() || (pEmail && aEmail === pEmail);
      });
      if(!exists){
        var colors = ['#185FA5', '#0F6E56', '#7F77DD', '#EF9F27', '#E24B4A', '#534AB7', '#085041', '#854F0B'];
        var color = colors[asesores.length % colors.length];
        // Use Tokko email as default but admin should update with Firebase login email
        var newA={id:'a'+(++nextAid), name:pName, email:pEmail, color:color, tokkoEmail:pEmail};
        asesores.push(newA);
        saveAsesorDoc(newA);
        producersAdded++;
      }
    });
    if(producersAdded > 0){
      renderAsesores();
      updAsesorSel();
      if(syncTimeout) clearTimeout(syncTimeout);
      saveSharedMeta();
      // Switch to Asesores tab so admin can set emails immediately
      var asesorBtn = document.getElementById('tab-btn-asesores');
      if(asesorBtn) asesorBtn.click();
      setTimeout(function(){
        alert('✅ Se crearon '+producersAdded+' asesor'+(producersAdded>1?'es':'')+' nuevos desde Tokko.\n\n⚠️ IMPORTANTE: andá a la pestaña Asesores y completá el email de login de cada uno para que puedan ver sus propiedades.');
      }, 300);
    }

    // Filter out already imported (by tokko id)
    var existingIds = props.map(function(p){ return p.tokkoId; }).filter(Boolean);
    var nuevas = items.filter(function(p){ return !existingIds.includes(String(p.id)); });

    mostrarModalTokko(nuevas, items.length);
  } catch(e) {
    console.error('Tokko import error:', e);
    alert('Error al conectar con Tokko. Verificá tu conexión e intentá de nuevo.\nDetalle: '+e.message);
  }
  btn.textContent = '🔄 Importar desde Tokko'; btn.disabled = false;
}

var _tokkoImportData = {};

function mostrarModalTokko(props_tokko, total){
  var existing = document.getElementById('tokko-overlay');

  // Store full objects indexed by id
  _tokkoImportData = {};

  var overlay = document.createElement('div');
  overlay.id = 'tokko-overlay';
  overlay.className = 'resumen-overlay';
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };

  var rows = props_tokko.map(function(p){
    var tipo = TOKKO_TIPO_MAP[p.type ? p.type.name : ''] || 'Casa';
    var addr = (p.address||'Sin dirección') + (p.floor ? ' piso '+p.floor : '') + (p.unit ? ' unidad '+p.unit : '');
    var precio = p.operations && p.operations[0] && p.operations[0].prices && p.operations[0].prices[0] ? p.operations[0].prices[0] : null;
    var precioStr = precio ? (precio.currency==='USD'?'USD ':'$') + Number(precio.price).toLocaleString('es-AR') : '—';
    var propietario = p.producer ? p.producer.name : '—';

    // Build meta info line
    var meta = [tipo, precioStr];
    if(propietario !== '—') meta.push(propietario);
    if(p.suite_amount) meta.push(p.suite_amount+'D');
    if(p.room_amount)  meta.push(p.room_amount+'A');
    if(p.bathroom_amount) meta.push(p.bathroom_amount+'B');
    if(p.location && p.location.full_location){
      var loc = p.location.full_location.split('|');
      if(loc.length >= 3) meta.push(loc[loc.length-1].trim());
    }

    return '<div class="tokko-row">'+
      '<input type="checkbox" class="tokko-check" data-id="'+p.id+'" checked/>'+
      '<div style="flex:1;">'+
        '<div class="tokko-addr">'+addr+'</div>'+
        '<div class="tokko-meta">'+meta.join(' · ')+'</div>'+
        (p.description ? '<div style="font-size:10px;color:#aaa;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px;">'+p.description.substring(0,80)+'...</div>' : '')+
      '</div>'+
      '<span class="tokko-badge">'+tipo+'</span>'+
    '</div>';
  }).join('');

  if(!rows){
    rows = '<div style="text-align:center;padding:20px;color:#888;font-size:13px;">✅ Todas las propiedades de Tokko ya están importadas en el tracker.</div>';
  }

  overlay.innerHTML = '<div class="tokko-modal">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'+
      '<h3 style="font-size:16px;font-weight:700;color:#1a1a1a;">Importar desde Tokko Broker</h3>'+
      '<button onclick="closeTokkoModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;">×</button>'+
    '</div>'+
    '<p style="font-size:12px;color:#888;margin-bottom:14px;">'+total+' propiedades en Tokko · '+(props_tokko.length)+' nuevas para importar. Seleccioná las que querés agregar al tracker.</p>'+
    (props_tokko.length ? '<div style="display:flex;gap:8px;margin-bottom:12px;">'+
      '<button onclick="tokkoSelectAll(true)" style="height:26px;padding:0 12px;font-size:11px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">Seleccionar todas</button>'+
      '<button onclick="tokkoSelectAll(false)" style="height:26px;padding:0 12px;font-size:11px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">Deseleccionar todas</button>'+
    '</div>' : '')+
    '<div>'+rows+'</div>'+
    (props_tokko.length ? '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #eee;">'+
      '<button onclick="closeTokkoModal()" style="height:34px;padding:0 16px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">Cancelar</button>'+
      '<button onclick="confirmarImportTokko()" style="height:34px;padding:0 16px;font-size:13px;font-weight:700;border:1px solid #185FA5;border-radius:8px;background:#E6F1FB;color:#0C447C;cursor:pointer;">Importar seleccionadas</button>'+
    '</div>' : '')+
  '</div>';

  document.body.appendChild(overlay);
}

function confirmarImportTokko(){
  var checks = document.querySelectorAll('.tokko-check:checked');
  if(!checks.length){ alert('Seleccioná al menos una propiedad.'); return; }

  checks.forEach(function(cb){
    var tk = _tokkoImportData[cb.dataset.id] || {};
    // Try to match producer name to an asesor
    var tkProducerName = tk.producer ? tk.producer.name.trim().toLowerCase() : '';
    var matchedAsesor = asesores.find(function(a){
      return a.name.trim().toLowerCase() === tkProducerName ||
             tkProducerName.indexOf(a.name.trim().toLowerCase()) >= 0 ||
             a.name.trim().toLowerCase().indexOf(tkProducerName) >= 0;
    });
    var asesorId = matchedAsesor ? matchedAsesor.id : (getMyAsesor() ? getMyAsesor().id : (asesores[0] ? asesores[0].id : 'a1'));

    // Extract all available fields from Tokko
    var tipo = TOKKO_TIPO_MAP[tk.type ? tk.type.name : ''] || 'Casa';
    var addr = (tk.address||'Sin dirección') + (tk.floor ? ' piso '+tk.floor : '') + (tk.unit ? ' unidad '+tk.unit : '');
    var precioObj = tk.operations && tk.operations[0] && tk.operations[0].prices && tk.operations[0].prices[0] ? tk.operations[0].prices[0] : null;
    var precioStr = precioObj ? (precioObj.currency==='USD'?'USD ':'$') + Number(precioObj.price).toLocaleString('es-AR') : '—';
    var propietario = tk.producer ? tk.producer.name : '—';

    // Ubicación
    var barrio = '';
    if(tk.location && tk.location.full_location){
      var loc = tk.location.full_location.split('|');
      barrio = loc[loc.length-1].trim();
    }

    // Apto banco — Tokko lo guarda en attributes
    var aptoBanco = false;
    if(tk.tags && tk.tags.length){
      aptoBanco = tk.tags.some(function(t){ return t.name && t.name.toLowerCase().includes('banco'); });
    }

    // Build observaciones con datos extra de Tokko
    var obs = [];
    if(barrio)               obs.push('📍 ' + barrio);
    if(tk.suite_amount)      obs.push('🛏 ' + tk.suite_amount + ' dormitorio' + (tk.suite_amount>1?'s':''));
    if(tk.room_amount)       obs.push('🏠 ' + tk.room_amount + ' ambiente' + (tk.room_amount>1?'s':''));
    if(tk.bathroom_amount)   obs.push('🚿 ' + tk.bathroom_amount + ' baño' + (tk.bathroom_amount>1?'s':''));
    if(tk.expenses)          obs.push('💸 Expensas: $' + Number(tk.expenses).toLocaleString('es-AR'));
    if(tk.property_condition) obs.push('Estado: ' + tk.property_condition);
    if(tk.age)               obs.push('Antigüedad: ' + tk.age + ' años');

    // Fecha de ingreso desde created_at de Tokko
    var fechaIngreso = '';
    if(tk.created_at){
      var crDate = new Date(tk.created_at);
      var dd = String(crDate.getDate()).padStart(2,'0');
      var mm = String(crDate.getMonth()+1).padStart(2,'0');
      var yyyy = crDate.getFullYear();
      fechaIngreso = dd+'/'+mm+'/'+yyyy;
    }

    var d = {
      addr:          addr,
      tipo:          tipo,
      asesorId:      asesorId,
      propietario:   propietario,
      precio:        precioStr,
      precioIngreso: precioStr,
      ingreso:       fechaIngreso,
      publicacion:   'Simple',
      web:           'Si',
      aptoBanco:     aptoBanco,
      observaciones: obs.join(' · '),
      tokkoId:       cb.dataset.id,
      tokkoUrl:      tk.public_url || '',
    };

    var nid = ++nextId;
    var newProp = mkProp(nid, d);
    newProp.tokkoId = cb.dataset.id;
    newProp.tokkoProducerName = tk.producer ? tk.producer.name : '';

    // Store description in the mkt_2 task if available
    if(tk.description){
      var mkt2 = newProp.tasks['mkt'].find(function(t){ return t.id==='mkt_2'; });
      if(mkt2){ mkt2.descripcion = tk.description; }
    }

    props.push(newProp);
    activeProp = nid;
  });

  document.getElementById('tokko-overlay').remove();
  renderGrid();
  renderDetail();
  // Save immediately after import — don't debounce
  if(syncTimeout) clearTimeout(syncTimeout);
  saveSharedMeta();
  alert('✅ '+checks.length+' propiedad'+(checks.length>1?'es importadas':' importada')+' correctamente.');
}

function doLogin(){
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value;
  var errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if(!email||!pass){ errEl.textContent='Completá email y contraseña.'; return; }
  var btn = document.querySelector('.login-btn');
  btn.textContent = 'Ingresando...'; btn.disabled = true;

  function attemptLogin(){
    if(!window._fb){
      setTimeout(attemptLogin, 100);
      return;
    }
    window._fb.signInWithEmailAndPassword(window._fb.auth, email, pass)
      .catch(function(err){
        console.error('Login error:', err.code, err.message);
        errEl.textContent = err.code==='auth/invalid-credential' || err.code==='auth/wrong-password' || err.code==='auth/user-not-found'
          ? 'Email o contraseña incorrectos.'
          : err.code==='auth/too-many-requests'
          ? 'Demasiados intentos. Esperá unos minutos.'
          : err.code==='auth/invalid-email'
          ? 'El email no es válido.'
          : 'Error: '+err.code;
        btn.textContent = 'Ingresar'; btn.disabled = false;
      });
  }
  attemptLogin();
}

function doLogout(){
  if(!confirm('¿Cerrar sesión?')) return;
  // Cancel any pending debounced save
  if(syncTimeout){ clearTimeout(syncTimeout); syncTimeout = null; }
  // Unsubscribe from Firestore listeners BEFORE signing out
  // so no snapshot arrives during cleanup
  unsubscribers.forEach(function(u){ try{ u(); }catch(e){} });
  unsubscribers = [];
  window._fb.signOut(window._fb.auth);
}

// ── Auth state — wait for Firebase module to load ─────────────────────────────
function initAuthListener(){
  if(!window._fb){
    setTimeout(initAuthListener, 100);
    return;
  }
  window._fb.onAuthStateChanged(window._fb.auth, function(user){
  if(user){
    currentUser = user;
    currentUserEmail = user.email;
    var name = user.email.split('@')[0];
    name = name.charAt(0).toUpperCase()+name.slice(1);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = '';
    document.getElementById('user-pill').style.display = 'flex';
    document.getElementById('sidebar').style.visibility = 'visible';
    document.getElementById('dark-toggle').style.display = 'flex';
    document.getElementById('user-name').textContent = name;
    startSync();
  } else {
    // Cancel any pending save before clearing user
    if(syncTimeout){ clearTimeout(syncTimeout); syncTimeout = null; }
    currentUser = null;
    currentUserEmail = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
    document.getElementById('user-pill').style.display = 'none';
    // Reset login button state
    var btn = document.querySelector('.login-btn');
    if(btn){ btn.textContent = 'Ingresar'; btn.disabled = false; }
    // Clear inputs to prevent autocomplete ghost login
    var emailEl = document.getElementById('login-email');
    var passEl  = document.getElementById('login-pass');
    if(emailEl) emailEl.value = '';
    if(passEl)  passEl.value  = '';
  }
  });
}
initAuthListener();

function showSaveToast(msg){
  var ind = document.getElementById('save-indicator');
  if(!ind) return;
  ind.style.display = 'block';
  ind.style.opacity = '1';
  ind.textContent = msg || '✅ Guardado';
  clearTimeout(ind._t);
  ind._t = setTimeout(function(){
    ind.style.opacity = '0';
    setTimeout(function(){ ind.style.display = 'none'; }, 300);
  }, 1500);
}

function saveProp(p){
  if(!currentUser || !p) return;
  window._fb.setDoc(window._fb.doc(window._fb.db,'sessa_props',String(p.id)),
    JSON.parse(JSON.stringify(p)))
    .then(function(){ showSaveToast('✅ Guardado'); })
    .catch(function(e){ console.error('[Sessa] saveProp error:',e); showSaveToast('❌ Error al guardar'); });
}

    JSON.parse(JSON.stringify(c)))
    .then(function(){ showSaveToast('✅ Guardado'); })
    .catch(function(e){ console.error('[Sessa] saveCap error:',e); showSaveToast('❌ Error al guardar'); });
}

function saveAsesorDoc(a){
  if(!currentUser || !a) return;
  window._fb.setDoc(window._fb.doc(window._fb.db,'sessa_asesores',String(a.id)),
    JSON.parse(JSON.stringify(a)))
    .then(function(){ showSaveToast('✅ Guardado'); })
    .catch(function(e){ console.error('[Sessa] saveAsesor error:',e); showSaveToast('❌ Error al guardar'); });
}

function saveMeta(){
  if(!currentUser) return;
  window._fb.setDoc(window._fb.doc(window._fb.db,'sessa_meta','shared'), {
    reservasLog: JSON.parse(JSON.stringify(reservasLog)),
    visitasDB:   JSON.parse(JSON.stringify(visitasDB)),
    busquedas:   JSON.parse(JSON.stringify(busquedas)),
    metaMensual: metaMensual,
    nextId:      nextId,
    nextCid:     nextCid,
    nextAid:     nextAid,
    nextCapId:   nextCapId,
  }, {merge:true}).catch(function(e){ console.error('[Sessa] saveMeta error:',e); });
}

function saveSharedMeta(){
  // Legacy alias — saves metadata only
  saveMeta();
}

function deletePropDoc(id){
  if(!currentUser) return;
  window._fb.deleteDoc(window._fb.doc(window._fb.db,'sessa_props',String(id)))
    .catch(function(e){ console.error('[Sessa] deleteProp error:',e); });
}

function deleteCompDoc(id){
  if(!currentUser) return;
  window._fb.deleteDoc(window._fb.doc(window._fb.db,'sessa_comp',String(id)))
    .catch(function(e){ console.error('[Sessa] deleteComp error:',e); });
}

function deleteCapDoc(id){
  if(!currentUser) return;
  window._fb.deleteDoc(window._fb.doc(window._fb.db,'sessa_cap',String(id)))
    .catch(function(e){ console.error('[Sessa] deleteCap error:',e); });
}

function scheduleSave(){
  if(syncTimeout) clearTimeout(syncTimeout);
  // Save immediately — debounce was causing data loss
  syncTimeout = setTimeout(function(){
    syncTimeout = null;
    saveSharedMeta();
  }, 300);
}

// ── Load from Firestore & listen ──────────────────────────────────────────────
function applyChange(arr, doc, type){
  var d = doc.data();
  if(type === 'removed'){
    return arr.filter(function(x){ return String(x.id) !== String(d.id); });
  }
  var idx = arr.findIndex(function(x){ return String(x.id) === String(d.id); });
  if(idx >= 0) arr[idx] = d; else arr.push(d);
  return arr;
}

function startSync(){
  var fb = window._fb;

  // Props — each prop is its own document
  var unsubProps = fb.onSnapshot(fb.collection(fb.db,'sessa_props'), function(snap){
    _remoteUpdate = true;
    snap.docChanges().forEach(function(ch){ props = applyChange(props, ch.doc, ch.type); });
    props.forEach(function(p){ if(p.id >= nextId) nextId = p.id + 1; });
    _remoteUpdate = false;
    _renderGridOnly();
    if(activeProp) _origRenderDetail();
    // Refresh inactivity tasks when props change
    if(typeof injectInactivityTasks === 'function') setTimeout(injectInactivityTasks, 1000);
  });
  unsubscribers.push(unsubProps);

  // Compradores — each comprador is its own document
  var unsubComp = fb.onSnapshot(fb.collection(fb.db,'sessa_comp'), function(snap){
    _remoteUpdate = true;
    snap.docChanges().forEach(function(ch){ compradores = applyChange(compradores, ch.doc, ch.type); });
    compradores.forEach(function(c){ if(c.id >= nextCid) nextCid = c.id + 1; });
    _remoteUpdate = false;
    _renderCompradoresOnly();
    renderCompradorDetail();
  });
  unsubscribers.push(unsubComp);

  // Captaciones — each captacion is its own document
  var unsubCap = fb.onSnapshot(fb.collection(fb.db,'sessa_cap'), function(snap){
    _remoteUpdate = true;
    snap.docChanges().forEach(function(ch){ captaciones = applyChange(captaciones, ch.doc, ch.type); });
    captaciones.forEach(function(c){ if(c.id >= nextCapId) nextCapId = c.id + 1; });
    _remoteUpdate = false;
    var capTab = document.getElementById('tab-captaciones');
    if(capTab && capTab.style.display !== 'none') _origRenderCaptaciones();
  });
  unsubscribers.push(unsubCap);

  // Asesores — each asesor is its own document
  var unsubAses = fb.onSnapshot(fb.collection(fb.db,'sessa_asesores'), function(snap){
    _remoteUpdate = true;
    snap.docChanges().forEach(function(ch){ asesores = applyChange(asesores, ch.doc, ch.type); });
    _remoteUpdate = false;
    updAsesorSel();
    _origRenderAsesores();
  });
  unsubscribers.push(unsubAses);

  // Metadata — reservas, visitas, meta mensual, busquedas
  var unsubMeta = fb.onSnapshot(fb.doc(fb.db,'sessa_meta','shared'), function(snap){
    if(!snap.exists()) return;
    var data = snap.data();
    if(data.reservasLog !== undefined) reservasLog = data.reservasLog;
    if(data.visitasDB !== undefined)   visitasDB   = data.visitasDB;
    if(data.metaMensual !== undefined) metaMensual = data.metaMensual;
    if(data.busquedas !== undefined)   busquedas   = data.busquedas;
    var bTab = document.getElementById('tab-busquedas');
    if(bTab && bTab.style.display !== 'none') renderBusquedas();
  });
  unsubscribers.push(unsubMeta);

  // Mi día — private per user
  fb.getDoc(fb.doc(fb.db,'tareas',currentUser.uid)).then(function(snap){
    if(snap.exists() && snap.data().tareasPerAsesor){
      tareasPerAsesor = snap.data().tareasPerAsesor;
    }
    var me = getMyAsesor();
    if(me) tareasAsesorActivo = me.id;
    else if(asesores.length) tareasAsesorActivo = asesores[0].id;
    var tabEl = document.getElementById('tab-tareas');
    if(tabEl && tabEl.style.display !== 'none') renderTareas();
    // Auto-inject inactivity reminders into Mi día
    setTimeout(injectInactivityTasks, 3000);
  });
}

// ── Hook saves into all mutating functions ────────────────────────────────────
var _remoteUpdate = false; // true while applying remote Firebase data

var _origRenderGrid = renderGrid;
var _renderGridOnly = function(){ _origRenderGrid(); };
renderGrid = function(){ _origRenderGrid(); };

var _origRenderCompradores = renderCompradores;
var _renderCompradoresOnly = function(){ _origRenderCompradores(); }; // raw, no save
renderCompradores = function(){
  _origRenderCompradores();
  if(!_remoteUpdate) scheduleSave();
};

var _origRenderTareas = renderTareas;
renderTareas = function(){
  _origRenderTareas();
  if(!_remoteUpdate) saveMiDia();
};

var _origRenderCaptaciones = renderCaptaciones;
renderCaptaciones = function(){ _origRenderCaptaciones(); };

var _origRenderDetail = renderDetail;
renderDetail = function(){ _origRenderDetail(); };

var _origRenderAsesores = renderAsesores;
renderAsesores = function(){ _origRenderAsesores(); };

// Initial render
renderGrid();
renderDetail();

</script>
